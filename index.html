                      />
                    </div>
                    <div className="col-span-5">
                      <SettingNumberField
                        label="Monatslimit €"
                        value={b.amount}
                        onChange={(val) => handleUpdateBudget(b.id, { amount: parseDecimal(val) })}
                      />
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-200/60 dark:border-slate-700/60 text-[11px]">
                    <div className="flex items-center gap-1.5">
                      <select
                        value={b.icon}
                        onChange={(e) => handleUpdateBudget(b.id, { icon: e.target.value })}
                        className="px-2 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-[11px]"
                        title="Icon wählen"
                      >
                        {AVAILABLE_ICONS.map((ic) => (
                          <option key={ic.id} value={ic.id}>
                            {ic.label}
                          </option>
                        ))}
                      </select>

                      <select
                        value={b.color}
                        onChange={(e) => handleUpdateBudget(b.id, { color: e.target.value })}
                        className="px-2 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-[11px]"
                        title="Farbe wählen"
                      >
                        {AVAILABLE_COLORS.map((col) => (
                          <option key={col.id} value={col.id}>
                            {col.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="flex items-center gap-2">
                      <label className="flex items-center gap-1 cursor-pointer text-[10px] font-semibold text-slate-600 dark:text-slate-300">
                        <input
                          type="checkbox"
                          checked={Boolean(b.hasWeeklyPacer)}
                          onChange={(e) => handleUpdateBudget(b.id, { hasWeeklyPacer: e.target.checked })}
                          className="rounded text-indigo-600"
                        />
                        <span>KW-Pacer</span>
                      </label>

                      <button
                        type="button"
                        onClick={() => handleDeleteBudget(b.id)}
                        className="p-1 text-slate-400 hover:text-rose-500 transition"
                        title="Budget-Kategorie löschen"
                      >
                        <Icon name="trash" size={14} />
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Neue Budget-Kategorie anlegen */}
            <form onSubmit={handleAddBudget} className="p-3 rounded-2xl bg-indigo-500/5 border border-indigo-500/20 space-y-2.5">
              <div className="text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                + Neue Budget-Kategorie erstellen
              </div>
              <div className="grid grid-cols-12 gap-2">
                <input
                  type="text"
                  placeholder="Name (z.B. Drogerie / Freizeit)"
                  value={newBudgetName}
                  onChange={(e) => setNewBudgetName(e.target.value)}
                  required
                  className="col-span-7 px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs"
                />
                <input
                  type="text"
                  inputMode="decimal"
                  placeholder="Limit €"
                  value={newBudgetAmount}
                  onChange={(e) => setNewBudgetAmount(e.target.value)}
                  required
                  className="col-span-5 px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-mono text-xs font-bold"
                />
              </div>
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-1.5">
                  <select
                    value={newBudgetIcon}
                    onChange={(e) => setNewBudgetIcon(e.target.value)}
                    className="px-2 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-[11px]"
                  >
                    {AVAILABLE_ICONS.map((ic) => (
                      <option key={ic.id} value={ic.id}>{ic.label}</option>
                    ))}
                  </select>
                  <select
                    value={newBudgetColor}
                    onChange={(e) => setNewBudgetColor(e.target.value)}
                    className="px-2 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-[11px]"
                  >
                    {AVAILABLE_COLORS.map((col) => (
                      <option key={col.id} value={col.id}>{col.label}</option>
                    ))}
                  </select>
                  <label className="flex items-center gap-1 text-[11px] font-medium cursor-pointer ml-1">
                    <input
                      type="checkbox"
                      checked={newBudgetPacer}
                      onChange={(e) => setNewBudgetPacer(e.target.checked)}
                      className="rounded text-indigo-600"
                    />
                    <span>Wochen-Pacer</span>
                  </label>
                </div>

                <button
                  type="submit"
                  className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1"
                >
                  <Icon name="plus" size={14} />
                  <span>Anlegen</span>
                </button>
              </div>
            </form>
          </section>

          {/* 3. PARTNER A: GEHALT, AUTO-DARLEHEN (Problem 7) & ENDLICHE RATENKREDITE (Problem 8) */}
          <section className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-4">
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                3. Partner A: Gehalt, Auto-Darlehen & Ratenkredite (Stufe 5)
              </h3>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Endliche Verbindlichkeiten flexibel verwalten und nach Tilgung entfernen
              </p>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <SettingNumberField
                label="Erwartetes Netto-Gehalt (15.)"
                value={c.expectedSalary15th}
                onChange={(v) => updateConfigField('expectedSalary15th', v)}
                highlight="indigo"
              />
              <SettingNumberField
                label="Auto-Rate an Partnerin (Mon.)"
                value={c.partnerLoan?.monthlyRate ?? 160}
                onChange={(v) => updatePartnerLoanField('monthlyRate', v)}
              />
              <SettingNumberField
                label="Auto-Kredit Gesamtsumme"
                value={c.partnerLoan?.totalAmount ?? 3200}
                onChange={(v) => updatePartnerLoanField('totalAmount', v)}
              />
              <SettingNumberField
                label="Bereits getilgt (Startwert)"
                value={c.partnerLoan?.baseRepaidBeforeApp ?? 640}
                onChange={(v) => updatePartnerLoanField('baseRepaidBeforeApp', v)}
              />
            </div>

            {/* Problem 8: Endliche Ratenkredite (KfW, Kühlschrank etc.) */}
            <div className="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-700 dark:text-slate-300">
                  Endliche Ratenkredite (KfW, Kühlschrank etc.)
                </span>
                <span className="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400">
                  Σ {formatEUR(finance.privateLoansTotal)} / Mon.
                </span>
              </div>

              <div className="space-y-2">
                {finance.privateLoansList.map((loan) => (
                  <div
                    key={loan.id}
                    className="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-700/70 space-y-2 text-xs"
                  >
                    <div className="flex items-center justify-between gap-2">
                      <input
                        type="text"
                        value={loan.name}
                        onChange={(e) => handleUpdatePrivateLoan(loan.id, { name: e.target.value })}
                        className="font-bold text-slate-900 dark:text-white bg-transparent border-b border-transparent focus:border-indigo-500 focus:outline-none w-full"
                      />
                      <button
                        onClick={() => handleRemovePrivateLoan(loan.id)}
                        className="text-slate-400 hover:text-rose-500 p-1 shrink-0"

                      >

                      </button>
                    </div>

                    <div className="grid grid-cols-12 gap-2 items-end">
                      <div className="col-span-5">
                        <SettingNumberField
                          label="Monatsrate €"
                          value={loan.amount}

                        />
                      </div>
                      <div className="col-span-4">
                        <label className="text-[10px] font-semibold uppercase text-slate-400 block mb-1">

                        </label>
                        <input

                      </div>
                      <div className="col-span-3 flex flex-col items-end justify-end">
                        <button

                              remainingMonths: Math.max(0, (Number(loan.remainingMonths) || 0) - 1)

              <form onSubmit={handleAddPrivateLoan} className="grid grid-cols-12 gap-2 pt-1">

    // ============================================================================
    // PROBLEM 1 FIX: ENTKOPPELTES NUMBER-INPUT MIT FOCUS-LOCK (Kein Zurückspringen!)
    // ============================================================================
    function SettingNumberField({ label, value, onChange, highlight }) {
      const [localVal, setLocalVal] = useState(() => String(value ?? 0));
      const [isFocused, setIsFocused] = useState(false);

      // Synchronisiere von außen NUR, wenn das Feld gerade NICHT aktiv getippt wird
      useEffect(() => {
        if (!isFocused) {
          const parsedLocal = parseDecimal(localVal);
          const numericProp = Number(value) || 0;
          if (Math.abs(parsedLocal - numericProp) > 0.001 || localVal === '') {
            setLocalVal(String(numericProp));
          }
        }
      }, [value, isFocused]);

      const handleChange = (e) => {
        const raw = e.target.value;
        setLocalVal(raw);
        // Wenn der Zwischenstand bereits eine gültige Zahl ist, live an State propagieren,
        // ohne den lokalen String (z.B. "1180," oder "") zu überschreiben!
        const cleaned = raw.trim();
        if (cleaned !== '' && cleaned !== '-' && !cleaned.endsWith(',') && !cleaned.endsWith('.')) {
          onChange(raw);
        }
      };

      const handleBlur = () => {
        setIsFocused(false);
        const finalNum = parseDecimal(localVal);
        setLocalVal(String(finalNum));
        onChange(String(finalNum));
      };

      const borderClass =
        highlight === 'emerald'
          ? 'border-emerald-500/40 bg-emerald-500/5'
          : highlight === 'indigo'
          ? 'border-indigo-500/40 bg-indigo-500/5'
          : 'border-slate-300/80 dark:border-slate-700 bg-slate-100 dark:bg-slate-800';

      return (
        <div>
          <label className="text-[10px] font-semibold uppercase text-slate-500 dark:text-slate-400 block mb-1 truncate">
            {label}
          </label>
          <div className="relative">
            <input
              type="text"
              inputMode="decimal"
              value={localVal}
              onFocus={() => setIsFocused(true)}
              onChange={handleChange}
              onBlur={handleBlur}
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  e.target.blur();
                }
              }}
              className={`w-full px-3 py-2 pr-7 rounded-2xl border font-mono text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 ${borderClass}`}
            />
            <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] text-slate-400 font-mono pointer-events-none">
              €
            </span>
          </div>
        </div>
      );
    }

        if (modalType === 'salary') return String(finance.effectiveSalary15);

        return '';

      const [date, setDate] = useState(() => getTodayISO());
      const [note, setNote] = useState('');

      // Expense-spezifische States (Problem 2, 3, 4, 6, 9)
      const [scope, setScope] = useState(preset.scope || 'joint'); // 'joint' | 'private_a' | 'buffer'
      const [category, setCategory] = useState(preset.category || firstBudgetId);
      const [paymentMethod, setPaymentMethod] = useState(preset.paymentMethod || 'Gemeinschaftskarte');
      const [addToKleinanzeigen, setAddToKleinanzeigen] = useState(true);

      // Reallokations-spezifische States (Problem 10)

      const [sourceBudgetId, setSourceBudgetId] = useState(
        preset.sourceBudgetId || surplusBudgets[0]?.id || firstBudgetId
      );
      const [targetType, setTargetType] = useState(preset.targetType || 'sinking_relief'); // 'sinking_relief' | 'buffer_boost' | 'budget_boost'
      const [targetMonthKey, setTargetMonthKey] = useState(() => shiftMonthKey(selectedMonthKey, 1));
      const [targetBudgetId, setTargetBudgetId] = useState(
        budgets.find((b) => b.id !== sourceBudgetId)?.id || firstBudgetId
      );

      const selectedSourceStat = finance.budgetStats.find((b) => b.id === sourceBudgetId);

      const handleSubmit = (e) => {
        e.preventDefault();
        const actionDate = date || getTodayISO();

        if (modalType === 'tip') {
          onAddTip(amount, actionDate, note || 'Schicht-Trinkgeld');
        } else if (modalType === 'expense') {
          onAddExpense({
            amount,
            scope,
            category,
            paymentMethod,
            note,
            date: actionDate,
            addToKleinanzeigen: scope !== 'private_a' && paymentMethod !== 'Gemeinschaftskarte' && addToKleinanzeigen

        } else if (modalType === 'salary') {

            sourceBudgetId,
            amount,
            targetType,
            targetMonthKey: targetType === 'budget_boost' ? selectedMonthKey : targetMonthKey,
            targetBudgetId: targetType === 'budget_boost' ? targetBudgetId : null,
            note
          });
        } else if (modalType === 'extraLoanPayment') {
          onAddExtraLoanPayment(amount, note || 'Sondertilgung Auto-Darlehen');
        }
        onClose();
      };

      const parsedPreviewAmount = parseDecimal(amount);

                <div className="space-y-1.5">

                        checked={addToKleinanzeigen}
                        onChange={(e) => setAddToKleinanzeigen(e.target.checked)}
                        className="rounded text-amber-600"
                      />
                      <span>Automatisch im 50:50 Barauslagen- & Kleinanzeigen-Cockpit verbuchen</span>
                    </label>
                  )}
                </>
              )}

              {/* PROBLEM 10: Reallokations-Optionen */}
              {modalType === 'reallocate' && (
                <div className="space-y-3">
                  <div>
                    <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                      Quell-Budget mit Überschuss ({formatMonthLabel(selectedMonthKey)})
                    </label>
                    <select
                      value={sourceBudgetId}
                      onChange={(e) => {
                        setSourceBudgetId(e.target.value);
                        const st = finance.budgetStats.find((b) => b.id === e.target.value);
                        if (st && st.remaining > 0) {
                          setAmount(String(Math.round(st.remaining * 100) / 100));
                        }
                      }}
                      className="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold"
                    >
                      {finance.budgetStats.map((b) => (
                        <option key={b.id} value={b.id}>
                          {b.name} (Rest: {formatEUR(b.remaining)})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                      Wohin soll der Überschuss fließen?
                    </label>
                    <div className="space-y-1.5">
                      <button
                        type="button"
                        onClick={() => setTargetType('sinking_relief')}
                        className={`w-full p-2.5 rounded-2xl text-left text-xs border transition ${
                          targetType === 'sinking_relief'
                            ? 'bg-indigo-600 text-white border-indigo-500 font-bold'
                            : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                        }`}
                      >
                        <div>1. Tagesgeld-Übertrag entlasten (Sinking Funds)</div>
                        <div className="text-[10px] opacity-80 font-normal">
                          Speist das Tagesgeld aus dem Restbudget und senkt deine Pflichtlast im Zielmonat!
                        </div>
                      </button>

                      <button
                        type="button"
                        onClick={() => setTargetType('buffer_boost')}
                        className={`w-full p-2.5 rounded-2xl text-left text-xs border transition ${
                          targetType === 'buffer_boost'
                            ? 'bg-cyan-600 text-white border-cyan-500 font-bold'
                            : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                        }`}
                      >
                        <div>2. In den 2× Puffer-Topf verschieben</div>
                        <div className="text-[10px] opacity-80 font-normal">
                          Erhöht direkt das verfügbare Puffer-Limit für Anschaffungen.
                        </div>
                      </button>

                      <button
                        type="button"
                        onClick={() => setTargetType('budget_boost')}
                        className={`w-full p-2.5 rounded-2xl text-left text-xs border transition ${
                          targetType === 'budget_boost'
                            ? 'bg-emerald-600 text-white border-emerald-500 font-bold'
                            : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                        }`}
                      >
                        <div>3. In anderes Alltags-Budget umbuchen</div>
                        <div className="text-[10px] opacity-80 font-normal">
                          Stärkt eine andere Budget-Kategorie im aktuellen Monat.
                        </div>
                      </button>
                    </div>
                  </div>

                  {targetType !== 'budget_boost' ? (
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                        Zielmonat für die Entlastung / den Rollover
                      </label>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={() => setTargetMonthKey(selectedMonthKey)}
                          className={`py-2 px-3 rounded-xl text-xs font-bold border ${
                            targetMonthKey === selectedMonthKey
                              ? 'bg-emerald-600 text-white border-emerald-500'
                              : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700'
                          }`}
                        >
                          {formatMonthLabel(selectedMonthKey)} (Sofort)
                        </button>
                        <button
                          type="button"
                          onClick={() => setTargetMonthKey(shiftMonthKey(selectedMonthKey, 1))}
                          className={`py-2 px-3 rounded-xl text-xs font-bold border ${
                            targetMonthKey === shiftMonthKey(selectedMonthKey, 1)
                              ? 'bg-emerald-600 text-white border-emerald-500'
                              : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700'
                          }`}
                        >
                          {formatMonthLabel(shiftMonthKey(selectedMonthKey, 1))} (Folgemonat)
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                        Ziel-Budget auswählen
                      </label>
                      <select
                        value={targetBudgetId}
                        onChange={(e) => setTargetBudgetId(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold"
                      >
                        {budgets
                          .filter((b) => b.id !== sourceBudgetId)
                          .map((b) => (
                            <option key={b.id} value={b.id}>
                              {b.name}
                            </option>
                          ))}
                      </select>
                    </div>
                  )}
                </div>
              )}

              {modalType !== 'salary' && modalType !== 'reallocate' && (
                <div className="grid grid-cols-12 gap-2">
                  <div className="col-span-7">
                    <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                      Notiz / Artikel
                    </label>
                    <input
                      type="text"
                      placeholder={
                        modalType === 'tip'
                          ? 'z.B. Spätschicht'
                          : scope === 'private_a'
                          ? 'z.B. Lunch / Kleidung'
                          : scope === 'buffer'
                          ? 'z.B. Obi Baumarkt'
                          : 'z.B. DM / Rewe / Kleinanzeigen'
                      }
                      value={note}
                      onChange={(e) => setNote(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs"
                    />
                  </div>
                  <div className="col-span-5">
                    <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                      Datum
                    </label>
                    <input
                      type="date"
                      value={date}
                      onChange={(e) => setDate(e.target.value)}
                      className="w-full px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs"
                    />
                  </div>
                </div>
              )}

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition"
              >
                Jetzt verbindlich speichern
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 11. NAVIGATION BUTTON HELPER & REACT MOUNT
    // ============================================================================
    function NavButton({ active, onClick, icon, label, badge, badgeColor }) {
      return (
        <button
          onClick={onClick}
          className={`relative flex flex-col items-center justify-center py-2 rounded-2xl transition-all active:scale-95 ${
            active
              ? 'text-indigo-600 dark:text-indigo-400 bg-indigo-500/10 font-semibold'
              : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 font-medium'
          }`}
        >
          <div className="relative">
            <Icon name={icon} size={20} />
            {badge && (
              <span
                className={`absolute -top-1.5 -right-5 px-1.5 py-0.2 rounded-full text-[9px] font-bold leading-tight ${badgeColor}`}
              >
                {badge}
              </span>
            )}
          </div>
          <span className="text-[11px] mt-1 tracking-tight">{label}</span>
        </button>
      );
    }

    // React 18 Root Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
