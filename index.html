  <script>
    window.__flowPilotErrors = [];
    window.addEventListener('error', function (event) {
      try {
        var msg = (event && event.message) ? event.message : 'Unbekannter Laufzeitfehler';
        var src = (event && event.filename) ? (event.filename.split('/').pop() + ':' + event.lineno) : '';
        window.__flowPilotErrors.push(msg + (src ? ' (' + src + ')' : ''));
        console.error('[FlowPilot Global Error Catcher]:', event.error || msg);
        var banner = document.getElementById('fp-global-error-banner');
        if (!banner && document.body) {
          banner = document.createElement('div');
          banner.id = 'fp-global-error-banner';
          banner.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;z-index:99999;background:#7f1d1d;color:#fef2f2;padding:12px 16px;border-radius:14px;font-family:sans-serif;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.5);border:1px solid #ef4444;display:flex;justify-content:space-between;align-items:center;gap:10px;';
          banner.innerHTML = '<div><strong style="display:block;margin-bottom:2px;">Laufzeit-Warnung abgefangen:</strong><span id="fp-global-error-text" style="opacity:0.9;"></span></div><button onclick="this.parentElement.remove()" style="background:#991b1b;color:white;border:1px solid #f87171;padding:4px 10px;border-radius:8px;font-weight:bold;cursor:pointer;">OK</button>';
          document.body.appendChild(banner);
        }
        var txt = document.getElementById('fp-global-error-text');
        if (txt) txt.textContent = msg;
      } catch (e) {}
    });

    window.addEventListener('unhandledrejection', function (event) {
      try {
        var reason = event && event.reason ? (event.reason.message || String(event.reason)) : 'Unhandled Promise Rejection';
        console.warn('[FlowPilot Unhandled Rejection]:', reason);
      } catch (e) {}
    });

const ASSETS_TO_CACHE = [
  './',
  './index.html',
  './manifest.json',
  './icon-192.png',
  './icon-512.png'
];

self.addEventListener('install', (event) => {
  self.skipWaiting();
  event.waitUntil(
    caches.open(CACHE_NAME).then(async (cache) => {
      for (const asset of ASSETS_TO_CACHE) {
        try {
          await cache.add(asset);
        } catch (err) {
          console.warn('Asset übersprungen:', asset);
        }
      }
    })
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) => {
      return Promise.all(
        keys.map((key) => {
          if (key !== CACHE_NAME) {
            return caches.delete(key);
          }
        })
      );
    }).then(() => self.clients.claim())
  );
});

self.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'SKIP_WAITING') {
    self.skipWaiting();
  }
});

self.addEventListener('fetch', (event) => {
  if (event.request.method !== 'GET') return;

  event.respondWith(
    caches.match(event.request).then((cachedResponse) => {
      if (cachedResponse) {
        return cachedResponse;
      }
      return fetch(event.request).then((networkResponse) => {
        return networkResponse;
      }).catch(() => {
        if (event.request.mode === 'navigate') {
          return caches.match('./index.html');
        }
      });
    })
  );
});
`;

    // ============================================================================

    const parseDecimal = (val) => {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (val === null || val === undefined) return 0;
      const cleaned = String(val).replace(/\s/g, '').replace(',', '.');
      if (cleaned === '' || cleaned === '-' || cleaned === '.') return 0;
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : Math.round(num * 100) / 100;
    };

    const formatEUR = (val, showSign = false) => {
      const num = Number(val) || 0;
      const formatted = new Intl.NumberFormat('de-DE', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(num);
      if (showSign && num > 0) return `+${formatted}`;
      return formatted;
    };

    const getTodayISO = () => {
      try {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      } catch (e) {
        return new Date().toISOString().split('T')[0];
      }
    };

    const getCurrentMonthKey = () => {
      return getTodayISO().slice(0, 7);
    };

    const formatMonthLabel = (monthKey) => {
      if (!monthKey || !monthKey.includes('-')) return '';
      const [y, m] = monthKey.split('-').map(Number);
      const d = new Date(y, m - 1, 1);
      return d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    };

    const shiftMonthKey = (monthKey, delta) => {
      const [y, m] = (monthKey || getCurrentMonthKey()).split('-').map(Number);
      let newY = y;
      let newM = m + delta;
      while (newM < 1) {
        newM += 12;
        newY -= 1;
      }
      while (newM > 12) {
        newM -= 12;
        newY += 1;
      }
      return `${newY}-${String(newM).padStart(2, '0')}`;
    };

    const addDaysISO = (dateStr, days) => {
      const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      base.setDate(base.getDate() + days);
      const yyyy = base.getFullYear();
      const mm = String(base.getMonth() + 1).padStart(2, '0');
      const dd = String(base.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const getDaysUntil = (dueDateStr) => {
      if (!dueDateStr) return 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueDateStr + 'T00:00:00');
      const diffMs = due.getTime() - today.getTime();
      return Math.round(diffMs / (1000 * 60 * 60 * 24));
    };

    const getLiveWeekRange = () => {
      const now = new Date();
      const cur = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const day = cur.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      const monday = new Date(cur);
      monday.setDate(cur.getDate() + diffToMonday);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const toISO = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dd}`;
      };

      const target = new Date(cur.valueOf());
      const dayNr = (cur.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
      }
      const weekNo = 1 + Math.ceil((firstThursday - target) / 604800000);

      return {
        weekNo,
        mondayISO: toISO(monday),
        sundayISO: toISO(sunday),
        mondayDisplay: monday.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }),

    // PROBLEM 5: Versionierte, verlustfreie Schema-Migrations-Engine (V1 -> V2)
    const migrateStateToV2 = (rawState) => {
      const defaults = getInitialState();
      if (!rawState || typeof rawState !== 'object') return defaults;

      try {
        // Sicherheits-Snapshot von V1 vor einer Migration speichern
        if (!rawState.schemaVersion || rawState.schemaVersion < SCHEMA_VERSION) {
          try {

        let migratedBudgets = Array.isArray(rawConfig.budgets) && rawConfig.budgets.length > 0

        // 2. Partner-Auto-Darlehen (Problem 7) aus rateAutoPartnerin migrieren
        const v1AutoRate = rawConfig.rateAutoPartnerin !== undefined ? Number(rawConfig.rateAutoPartnerin) : 160.00;

        let migratedPrivateLoans = Array.isArray(rawConfig.privateLoans)

          : [];

          const kfwRate = rawConfig.rateKfw !== undefined ? Number(rawConfig.rateKfw) : 135.00;

    // ============================================================================

      // GUARDRAIL 2 & PROBLEM 5: Service Worker direkt registrieren (ohne window.load) + Update-Listener
      useEffect(() => {

            .register('./sw.js')
            .then((registration) => {

              registration.addEventListener('updatefound', () => {

      const handleCheckAndApplyPwaUpdate = async () => {
        try {

          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if ('serviceWorker' in navigator) {
            const reg = swRegistration || (await navigator.serviceWorker.getRegistration());
            if (reg) {
              await reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });

          if ('caches' in window) {

          showNotification('Update-Prüfung abgeschlossen. Lade App neu...', 'info');
          setTimeout(() => window.location.reload(), 700);

      };

      // ==========================================================================
      // 4. CORE FINANCIAL ENGINE (Alle 11 Probleme mathematisch konsistent)
      // ==========================================================================
      const finance = useMemo(() => {
        const c = state.config;
        const isCurrentMonth = selectedMonthKey === currentMonthKey;
        const reallocations = state.reallocations || [];

        // --- STUFE 1: Wohn- & Nebenkosten (Netto Gemeinschaft) ---
        const warmmiete = Number(c.warmmiete) || 0;
        const wohngeld = Number(c.wohngeld) || 0;
        const netRentAfterWohngeld = Math.max(0, warmmiete - wohngeld);
        const stromHeizungInternet = Number(c.stromHeizungInternet) || 0;
        const sonstigeGemeinschaftFix = Number(c.sonstigeGemeinschaftFix) || 0;
        const stage1HousingAndUtilitiesNet = netRentAfterWohngeld + stromHeizungInternet + sonstigeGemeinschaftFix;

        // --- STUFE 2: Dynamische Alltagsbudgets (Gemeinschaft) & Reallokationen ---
        const dynamicBudgets = Array.isArray(c.budgets) ? c.budgets : [];
        const kindergeld = Number(c.kindergeld) || 0;

        // Brutto-Summe aller dynamischen Alltagsbudgets (Grundkonfiguration)
        const grossDynamicBudgetsTotal = dynamicBudgets.reduce((sum, b) => sum + (Number(b.amount) || 0), 0);
        // Netto-Alltagsbudgets nach 1:1 Kindergeld-Verrechnung
        const stage2BudgetsNet = Math.max(0, grossDynamicBudgetsTotal - kindergeld);

        // --- STUFE 3: Sinking Funds (ING Tagesgeld Dauerübertrag) inkl. Rollover-Entlastung ---
        const sinkingMonthlyGross = (c.sinkingFunds || []).reduce((acc, item) => {

        // Überschuss-Entlastungen (Problem 10: Modus A -> Sinking Relief für selectedMonthKey)
        const sinkingReliefThisMonth = reallocations
          .filter((r) => r.targetMonthKey === selectedMonthKey && r.targetType === 'sinking_relief')
          .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);

        const sinkingMonthlyEffective = Math.max(0, sinkingMonthlyGross - sinkingReliefThisMonth);
        const stage3SinkingInJoint = c.includeSinkingInJoint ? sinkingMonthlyEffective : 0;

        // --- STUFE 4: Gemeinschafts-Soll Partner A (50% aus Stufe 1 + Stufe 2 + Stufe 3) ---
        const remainingJointToSplit = stage1HousingAndUtilitiesNet + stage2BudgetsNet + stage3SinkingInJoint;

        const loanExtraTotal = (pLoan.extraPayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);

        const statusMap = pLoan.monthlyStatus || {};
        const currentMonthLoanStatus = statusMap[selectedMonthKey] || 'regular'; // 'regular' | 'paused'
        const isPartnerLoanPausedThisMonth = currentMonthLoanStatus === 'paused';

        // Zähle alle pausierten Monate für das Rückstands-Archiv
        const pausedMonthKeys = Object.keys(statusMap).filter((k) => statusMap[k] === 'paused').sort();
        const pausedMonthsCount = pausedMonthKeys.length;
        const pausedArrearsTotal = pausedMonthsCount * loanRegularRate;

        // Berechne geleistete reguläre Raten (alle explizit als 'regular' geführten Monate; falls aktueller Monat nicht pausiert ist, zählt er als 1 reguläre Tilgungsrate)
        const explicitRegularMonths = Object.keys(statusMap).filter((k) => statusMap[k] === 'regular' && k !== selectedMonthKey).length;
        const activeMonthRegularCount = isPartnerLoanPausedThisMonth ? 0 : 1;
        const totalRepaidSoFar = Math.min(
          loanTotalAmount,
          loanBaseRepaid + loanExtraTotal + (explicitRegularMonths + activeMonthRegularCount) * loanRegularRate
        );
        const remainingDebtBeforeCurrent = Math.max(
          0,
          loanTotalAmount - (loanBaseRepaid + loanExtraTotal + explicitRegularMonths * loanRegularRate)
        );
        const partnerLoanRemainingDebt = Math.max(0, loanTotalAmount - totalRepaidSoFar);

        // Effektive Monatsrate in Stufe 5: Bei 'paused' sofort 0,00 €!
        const effectivePartnerLoanRateThisMonth = isPartnerLoanPausedThisMonth
          ? 0
          : Math.min(loanRegularRate, remainingDebtBeforeCurrent);

        const partnerLoanRemainingMonths = loanRegularRate > 0
          ? Math.ceil(partnerLoanRemainingDebt / loanRegularRate)
          : 0;

        // Problem 8: Endliche private Ratenverpflichtungen (KfW, Kühlschrank etc.)
        const privateLoansList = Array.isArray(c.privateLoans) ? c.privateLoans : [];
        const privateLoansTotal = privateLoansList
          .filter((l) => (Number(l.remainingMonths) || 0) > 0)
          .reduce((sum, l) => sum + (Number(l.amount) || 0), 0);

        const privateAbosTotal = (c.privateAbos || []).reduce((sum, a) => sum + (Number(a.amount) || 0), 0);

        // Pay-in-30 Verbindlichkeiten
        const openPayIn30Items = (state.payIn30 || []).filter((item) => !item.settled);
        const settledPayIn30Items = (state.payIn30 || []).filter((item) => item.settled);
        const duePayIn30Total = openPayIn30Items
          .filter((item) => item.dueDate && item.dueDate.startsWith(selectedMonthKey))
          .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const lockedPayIn30Total = openPayIn30Items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const privateMandatoryBase = effectivePartnerLoanRateThisMonth + privateLoansTotal + privateAbosTotal;
        const stage5PrivateMandatoryTotal = privateMandatoryBase + duePayIn30Total;

        // --- GESAMT-PFLICHTLAST PARTNER A ---
        const gesamtPflichtlast = partnerAJointShare + stage5PrivateMandatoryTotal;

        // Gehaltseingang am 15.
        const monthSalaryData = state.monthlySalaries?.[selectedMonthKey];
        const salaryConfirmed = monthSalaryData?.confirmed !== undefined
          ? monthSalaryData.confirmed
          : (isCurrentMonth ? c.salaryConfirmed : false);

        const effectiveSalary15 = monthSalaryData?.actual !== undefined
          ? (salaryConfirmed ? Number(monthSalaryData.actual) : (Number(c.expectedSalary15th) || 0))
          : (c.salaryConfirmed ? (Number(c.actualSalary15th) || 0) : (Number(c.expectedSalary15th) || 0));

        const pflichtLueckeNachGehalt = Math.max(0, gesamtPflichtlast - effectiveSalary15);
        const salarySurplus = Math.max(0, effectiveSalary15 - gesamtPflichtlast);

        // Schicht-Trinkgelder im Monat
        const monthlyTips = (state.tips || []).filter((t) => t.date && t.date.startsWith(selectedMonthKey));
        const totalTips = monthlyTips.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

        // Pflicht-Einzahlungs-Soll
        const offenesPflichtSoll = Math.max(0, pflichtLueckeNachGehalt - totalTips);
        const coveredByTips = Math.min(pflichtLueckeNachGehalt, totalTips);
        const pflichtProgressPercent = pflichtLueckeNachGehalt <= 0
          ? 100
          : Math.min(100, Math.round((coveredByTips / pflichtLueckeNachGehalt) * 100));
        const isPflichtCovered = offenesPflichtSoll <= 0.004;

        // --- AUSGABEN-SEGMENTIERUNG (Problem 3, 4, 6, 9, 10) ---
        const monthlyExpenses = (state.expenses || []).filter((e) => e.date && e.date.startsWith(selectedMonthKey));

        // 1. Gemeinschaftsausgaben (50:50 Alltagsbudgets)
        const jointExpenses = monthlyExpenses.filter((e) => !e.scope || e.scope === 'joint');
        // 2. Private Ausgaben Partner A (100% Taschengeld-Abzug, Problem 9)
        const privateAExpenses = monthlyExpenses.filter((e) => e.scope === 'private_a');
        const spentPrivateATotal = privateAExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        // 3. Dynamischer Puffer (2x Hebel, Problem 6)
        const bufferExpenses = monthlyExpenses.filter((e) => e.scope === 'buffer');
        const spentBufferTotal = bufferExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const partnerABufferShare = spentBufferTotal * 0.5;

        // --- TASCHENGELD & DYNAMISCHER 2x PUFFER (Problem 6 & 9 mathematisch zirkularitätsfrei) ---
        // Brutto-Taschengeld vor Privatausgaben und vor Puffer
        const grossFreePocketMoney = Math.max(0, totalTips - pflichtLueckeNachGehalt) + salarySurplus;
        // Basis-Taschengeld nach 100% privaten Ausgaben von Partner A (Anker für den 2x Puffer-Deckel)
        const basePocketMoneyBeforeBuffer = Math.max(0, grossFreePocketMoney - spentPrivateATotal);

        // Rollover-Boosts in den Puffer für selectedMonthKey (Problem 10)
        const bufferRolloverBoost = reallocations
          .filter((r) => r.targetMonthKey === selectedMonthKey && r.targetType === 'buffer_boost')
          .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);

        // Brutto-Puffer-Kapazität = 2 * Basis-Taschengeld + Rollover-Boost
        const bufferMaxCapacity = 2 * basePocketMoneyBeforeBuffer + bufferRolloverBoost;
        // Verfügbarer Rest-Puffer
        const bufferRemaining = Math.max(0, bufferMaxCapacity - spentBufferTotal);
        // Aktuelles Netto-Taschengeld Partner A (nach Abzug des 50% Puffer-Anteils)
        const netFreePocketMoney = Math.max(0, basePocketMoneyBeforeBuffer - partnerABufferShare);

        // --- DYNAMISCHE BUDGET-AUSWERTUNG INKL. WOCHEN-PACER & REALLOKATIONEN ---
        const liveWeek = getLiveWeekRange();
        const [selYear, selMonth] = selectedMonthKey.split('-').map(Number);
        const daysInSelectedMonth = new Date(selYear, selMonth, 0).getDate();
        const weeksInMonth = daysInSelectedMonth / 7;

        const budgetStats = dynamicBudgets.map((b) => {
          const baseAmount = Number(b.amount) || 0;
          const reallocatedOut = reallocations
            .filter((r) => r.sourceMonthKey === selectedMonthKey && r.sourceBudgetId === b.id)
            .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
          const reallocatedIn = reallocations
            .filter((r) => r.targetMonthKey === selectedMonthKey && r.targetType === 'budget_boost' && r.targetBudgetId === b.id)
            .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);

          const effectiveTotal = Math.max(0, baseAmount - reallocatedOut + reallocatedIn);
          const spent = jointExpenses
            .filter((e) => e.category === b.id)
            .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
          const remaining = effectiveTotal - spent;

          // Wochen-Pacer (für jedes Budget mit hasWeeklyPacer === true)
          let weeklyAllowance = 0;
          let spentThisWeek = 0;
          let weeklyRemaining = 0;
          if (b.hasWeeklyPacer) {
            weeklyAllowance = effectiveTotal / weeksInMonth;
            spentThisWeek = (state.expenses || [])
              .filter(
                (e) =>
                  (!e.scope || e.scope === 'joint') &&
                  e.category === b.id &&
                  e.date >= liveWeek.mondayISO &&
                  e.date <= liveWeek.sundayISO
              )
              .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
            weeklyRemaining = weeklyAllowance - spentThisWeek;
          }

          return {
            ...b,
            baseAmount,
            reallocatedOut,
            reallocatedIn,
            effectiveTotal,
            spent,
            remaining,
            weeklyAllowance,
            spentThisWeek,
            weeklyRemaining
          };
        });

        const totalUnspentBudgetSurplus = budgetStats.reduce(
          (sum, b) => sum + Math.max(0, b.remaining),
          0
        );

        // --- KLEINANZEIGEN & BARAUSLAGEN-SALDO (Problem 2) ---
        const openKleinanzeigen = (state.kleinanzeigen || []).filter((k) => !k.settled);
        const settledKleinanzeigen = (state.kleinanzeigen || []).filter((k) => k.settled);
        let netBalanceForA = 0;
        let totalPaidByA = 0;
        let totalPaidByB = 0;
        openKleinanzeigen.forEach((item) => {
          const amt = Number(item.amount) || 0;
          const shareAPercent = Number(item.splitPercentA ?? 50) / 100;
          const shareBPercent = 1 - shareAPercent;
          if (item.paidBy === 'A') {
            totalPaidByA += amt;
            netBalanceForA += amt * shareBPercent;
          } else {
            totalPaidByB += amt;
            netBalanceForA -= amt * shareAPercent;
          }
        });

        return {
          isCurrentMonth,
          // 5-Stufen-Formel-Werte (Problem 11)
          warmmiete,
          wohngeld,
          netRentAfterWohngeld,
          stromHeizungInternet,
          sonstigeGemeinschaftFix,
          stage1HousingAndUtilitiesNet,
          grossDynamicBudgetsTotal,
          kindergeld,
          stage2BudgetsNet,
          sinkingMonthlyGross,
          sinkingReliefThisMonth,
          sinkingMonthlyEffective,
          stage3SinkingInJoint,
          remainingJointToSplit,
          partnerAJointShare,
          // Stufe 5 & Darlehen (Problem 7 & 8)
          partnerLoan: pLoan,
          loanTotalAmount,
          loanRegularRate,
          totalRepaidSoFar,
          partnerLoanRemainingDebt,
          partnerLoanRemainingMonths,
          isPartnerLoanPausedThisMonth,
          effectivePartnerLoanRateThisMonth,
          pausedMonthKeys,
          pausedMonthsCount,
          pausedArrearsTotal,
          privateLoansList,
          privateLoansTotal,
          privateAbosTotal,
          privateMandatoryBase,
          duePayIn30Total,
          lockedPayIn30Total,
          stage5PrivateMandatoryTotal,
          gesamtPflichtlast,
          // Einkommen & Deckung
          effectiveSalary15,
          salaryConfirmed,
          pflichtLueckeNachGehalt,
          salarySurplus,
          totalTips,
          monthlyTips,
          offenesPflichtSoll,
          coveredByTips,
          pflichtProgressPercent,
          isPflichtCovered,
          // Taschengeld, Privatausgaben & 2x Puffer (Problem 6 & 9)
          grossFreePocketMoney,
          spentPrivateATotal,
          basePocketMoneyBeforeBuffer,
          bufferRolloverBoost,
          bufferMaxCapacity,
          spentBufferTotal,
          partnerABufferShare,
          bufferRemaining,
          netFreePocketMoney,
          // Dynamische Budgets & Reallokation (Problem 3, 4, 10)
          liveWeek,
          budgetStats,
          totalUnspentBudgetSurplus,
          monthlyExpenses,
          jointExpenses,
          privateAExpenses,
          bufferExpenses,
          // PayIn30 & Kleinanzeigen (Problem 2)
          openPayIn30Items,
          settledPayIn30Items,
          openKleinanzeigen,
          settledKleinanzeigen,
          totalPaidByA,
          totalPaidByB,
          netBalanceForA
        };
      }, [state, selectedMonthKey, currentMonthKey]);

      // ==========================================================================
      // 5. ACTION HANDLERS
      // ==========================================================================
      const toggleTheme = () => {
        setState((prev) => ({
          ...prev,
          theme: prev.theme === 'dark' ? 'light' : 'dark'
        }));
      };

      const addTip = (amount, date, note) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const tipDate = date || getTodayISO();
        const newTip = {
          id: 'tip-' + Date.now(),
          date: tipDate,
          amount: val,
          note: note || 'Schicht-Trinkgeld'
        };
        setState((prev) => ({
          ...prev,
          tips: [newTip, ...(prev.tips || [])]
        }));
        showNotification(`+${formatEUR(val)} Schicht-Trinkgeld für ${tipDate} verbucht!`);
      };

      const deleteTip = (id) => {
        setState((prev) => ({
          ...prev,
          tips: (prev.tips || []).filter((t) => t.id !== id)
        }));
        showNotification('Trinkgeld-Eintrag gelöscht', 'info');
      };

      const addExpense = ({ amount, scope, category, paymentMethod, note, date, addToKleinanzeigen }) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const expDate = date || getTodayISO();
        const effectiveScope = scope || 'joint'; // 'joint' | 'private_a' | 'buffer'
        const newExp = {
          id: 'exp-' + Date.now(),
          date: expDate,
          scope: effectiveScope,
          category: effectiveScope === 'joint' ? category : (effectiveScope === 'private_a' ? 'privat_a' : 'puffer_2x'),
          amount: val,
          paymentMethod: effectiveScope === 'private_a' ? 'Privat A (100%)' : paymentMethod,
          note: note || ''
        };

        let updatedKleinanzeigen = state.kleinanzeigen || [];
        if (
          effectiveScope !== 'private_a' &&
          addToKleinanzeigen &&
          (paymentMethod === 'Bar A' || paymentMethod === 'Bar B')
        ) {
          const matchedBudget = (state.config.budgets || []).find((b) => b.id === category);
          const catLabel = effectiveScope === 'buffer'
            ? '2× Puffer-Anschaffung'
            : (matchedBudget ? matchedBudget.name : category);

          updatedKleinanzeigen = [
            {
              id: 'ka-' + Date.now(),
              date: expDate,
              title: `Barauslage (${catLabel})${note ? ': ' + note : ''}`,
              amount: val,
              paidBy: paymentMethod === 'Bar A' ? 'A' : 'B',
              splitPercentA: 50,
              settled: false
            },
            ...updatedKleinanzeigen
          ];
        }

        setState((prev) => ({
          ...prev,
          expenses: [newExp, ...(prev.expenses || [])],
          kleinanzeigen: updatedKleinanzeigen
        }));

        if (effectiveScope === 'private_a') {
          showNotification(`Privatausgabe (${formatEUR(val)}) direkt vom Taschengeld abgezogen!`);
        } else if (effectiveScope === 'buffer') {
          showNotification(`Puffer-Ausgabe (${formatEUR(val)} | Dein 50% Einsatz: ${formatEUR(val * 0.5)}) gebucht!`);
        } else {
          showNotification(`Gemeinschaftsausgabe (${formatEUR(val)}) gespeichert!`);
        }
      };

      const deleteExpense = (id) => {
        setState((prev) => ({
          ...prev,
          expenses: (prev.expenses || []).filter((e) => e.id !== id)
        }));
        showNotification('Ausgabe entfernt', 'info');
      };

      const updateSalary15th = (amountStr, confirmed = true) => {
        const val = parseDecimal(amountStr);
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            actualSalary15th: val,
            salaryConfirmed: confirmed
          },
          monthlySalaries: {
            ...(prev.monthlySalaries || {}),
            [selectedMonthKey]: { actual: val, confirmed }
          }
        }));
        showNotification(`Netto-Gehalt für ${formatMonthLabel(selectedMonthKey)} (${formatEUR(val)}) gespeichert!`);
      };

      // Problem 7: Partner-Darlehen Monatsrate pausieren / aktivieren & Sonderzahlung
      const togglePartnerLoanMonthStatus = (monthKey = selectedMonthKey) => {
        setState((prev) => {
          const curLoan = prev.config.partnerLoan || {};
          const curStatus = curLoan.monthlyStatus?.[monthKey] || 'regular';
          const nextStatus = curStatus === 'regular' ? 'paused' : 'regular';
          return {
            ...prev,
            config: {
              ...prev.config,
              partnerLoan: {
                ...curLoan,
                monthlyStatus: {
                  ...(curLoan.monthlyStatus || {}),
                  [monthKey]: nextStatus
                }
              }
            }
          };
        });
        const wasPaused = (state.config.partnerLoan?.monthlyStatus?.[monthKey] || 'regular') === 'paused';
        if (!wasPaused) {
          showNotification(`Auto-Rate für ${formatMonthLabel(monthKey)} ausgesetzt (-${formatEUR(finance.loanRegularRate)} Pflichtlast)!`);
        } else {
          showNotification(`Auto-Rate für ${formatMonthLabel(monthKey)} wieder regulär aktiviert!`);
        }
      };

      const addPartnerLoanExtraPayment = (amountStr, noteStr) => {
        const val = parseDecimal(amountStr);
        if (val <= 0) return;
        const newPayment = {
          id: 'lp-' + Date.now(),
          date: getTodayISO(),
          amount: val,
          note: noteStr || 'Sondertilgung Auto-Kredit'
        };
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            partnerLoan: {
              ...(prev.config.partnerLoan || {}),
              extraPayments: [newPayment, ...(prev.config.partnerLoan?.extraPayments || [])]
            }
          }
        }));
        showNotification(`Sondertilgung (${formatEUR(val)}) auf Auto-Darlehen verbucht!`);
      };

      const deletePartnerLoanExtraPayment = (id) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            partnerLoan: {
              ...(prev.config.partnerLoan || {}),
              extraPayments: (prev.config.partnerLoan?.extraPayments || []).filter((p) => p.id !== id)
            }
          }
        }));
      };

      // Problem 10: Intelligente Überschuss-Reallokation (Rollover & Sinking-Entlastung)
      const addReallocation = ({ sourceBudgetId, amount, targetType, targetMonthKey, targetBudgetId, note }) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const newRealloc = {
          id: 'ral-' + Date.now(),
          date: getTodayISO(),
          sourceMonthKey: selectedMonthKey,
          sourceBudgetId,
          targetMonthKey: targetMonthKey || selectedMonthKey,
          targetType, // 'sinking_relief' | 'buffer_boost' | 'budget_boost'
          targetBudgetId: targetBudgetId || null,
          amount: val,
          note: note || ''
        };
        setState((prev) => ({
          ...prev,
          reallocations: [newRealloc, ...(prev.reallocations || [])],
          config: {
            ...prev.config,
            tagesgeldBalance: targetType === 'sinking_relief'
              ? (Number(prev.config.tagesgeldBalance) || 0) + val
              : prev.config.tagesgeldBalance
          }
        }));
        if (targetType === 'sinking_relief') {
          showNotification(`${formatEUR(val)} Überschuss senkt den Tagesgeld-Pflichtübertrag in ${formatMonthLabel(targetMonthKey)}!`);
        } else if (targetType === 'buffer_boost') {
          showNotification(`${formatEUR(val)} Überschuss in den 2× Puffer-Topf (${formatMonthLabel(targetMonthKey)}) verschoben!`);
        } else {
          showNotification(`${formatEUR(val)} Budget-Überschuss erfolgreich umgebucht!`);
        }
      };

      const deleteReallocation = (id) => {
        const target = (state.reallocations || []).find((r) => r.id === id);
        setState((prev) => ({
          ...prev,
          reallocations: (prev.reallocations || []).filter((r) => r.id !== id),
          config: {
            ...prev.config,
            tagesgeldBalance: target && target.targetType === 'sinking_relief'
              ? Math.max(0, (Number(prev.config.tagesgeldBalance) || 0) - (Number(target.amount) || 0))
              : prev.config.tagesgeldBalance
          }
        }));
        showNotification('Überschuss-Umbuchung rückgängig gemacht', 'info');
      };

      const addPayIn30 = ({ merchant, item, amount, purchaseDate, dueDate }) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const buyDate = purchaseDate || getTodayISO();
        const payDate = dueDate || addDaysISO(buyDate, 30);
        const newEntry = {
          id: 'p30-' + Date.now(),
          merchant: merchant || 'Klarna / PayPal 30T',
          item: item || 'Später-Bezahlen-Kauf',
          amount: val,
          purchaseDate: buyDate,
          dueDate: payDate,
          includeInCurrentMonthPflicht: true,
          settled: false
        };
        setState((prev) => ({
          ...prev,
          payIn30: [newEntry, ...(prev.payIn30 || [])]
        }));
        showNotification(`${formatEUR(val)} als Pay-in-30 gesperrt!`);
      };

      const markPayIn30Settled = (id) => {
        setState((prev) => ({
          ...prev,
          payIn30: (prev.payIn30 || []).map((item) =>
            item.id === id ? { ...item, settled: !item.settled } : item
          )
        }));
        showNotification('Status der Verbindlichkeit aktualisiert!');
      };

      const deletePayIn30 = (id) => {
        setState((prev) => ({
          ...prev,
          payIn30: (prev.payIn30 || []).filter((item) => item.id !== id)
        }));
        showNotification('Pay-in-30 Eintrag gelöscht', 'info');
      };

      const settleAllKleinanzeigen = () => {
        setState((prev) => ({
          ...prev,
          kleinanzeigen: (prev.kleinanzeigen || []).map((k) => ({ ...k, settled: true }))
        }));
        showNotification('Alle offenen Barauslagen als ausgeglichen markiert!');
      };

      const toggleKleinanzeigenSettled = (id) => {
        setState((prev) => ({
          ...prev,
          kleinanzeigen: (prev.kleinanzeigen || []).map((k) =>
            k.id === id ? { ...k, settled: !k.settled } : k
          )
        }));
      };

      const deleteKleinanzeigen = (id) => {
        setState((prev) => ({
          ...prev,
          kleinanzeigen: (prev.kleinanzeigen || []).filter((k) => k.id !== id)
        }));
      };

      const resetNewMonth = () => {
        setState((prev) => ({
          ...prev,
          tips: (prev.tips || []).filter((t) => !t.date || !t.date.startsWith(selectedMonthKey)),
          expenses: (prev.expenses || []).filter((e) => !e.date || !e.date.startsWith(selectedMonthKey)),
          monthlySalaries: {
            ...(prev.monthlySalaries || {}),
            [selectedMonthKey]: { actual: prev.config.expectedSalary15th, confirmed: false }
          }
        }));
        showNotification(`Buchungen für ${formatMonthLabel(selectedMonthKey)} zurückgesetzt!`);
      };

      const openModal = (type, preset = {}) => {
        setModalState({ type, preset });
      };

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-slate-100 dark:bg-slate-950 border-x border-slate-200/70 dark:border-slate-800/80 shadow-2xl relative">
          {/* Header mit Monatsnavigation */}
          <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/90 dark:bg-slate-900/90 border-b border-slate-200/80 dark:border-slate-800/80 px-4 pt-3 pb-2.5 space-y-2">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-900 to-blue-900 flex items-center justify-center text-white shadow-md shadow-blue-900/30">
                  <Icon name="wallet" size={17} />
                </div>
                <div>
                  <h1 className="font-bold text-sm tracking-tight text-slate-900 dark:text-white leading-tight">
                    FlowPilot <span className="text-blue-600 dark:text-blue-400">Partner A</span>
                  </h1>
                  <span className="text-[10px] text-slate-500 dark:text-slate-400 font-medium">
                    Cashflow & Schicht-Tracker • v2.0
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                {swUpdateAvailable && (
                  <button
                    onClick={handleCheckAndApplyPwaUpdate}
                    className="px-2 py-1.5 rounded-xl bg-amber-500/20 text-amber-600 dark:text-amber-300 border border-amber-500/30 text-[11px] font-bold flex items-center gap-1 animate-pulse"
                    title="Neues App-Update installieren"
                  >
                    <Icon name="refresh" size={12} />
                    <span>Update</span>
                  </button>
                )}

                {deferredInstallPrompt && (
                  <button
                    onClick={handleTriggerInstall}
                    className="px-2.5 py-1.5 rounded-xl bg-blue-900/20 hover:bg-blue-900/30 text-blue-800 dark:text-blue-300 border border-blue-800/30 text-xs font-bold flex items-center gap-1 active:scale-95 transition animate-pulse"
                    title="Auf Google Pixel installieren"
                  >
                    <Icon name="smartphone" size={13} />
                    <span>Installieren</span>
                  </button>
                )}

                <button
                  onClick={() => openModal('tip')}

                className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold shrink-0 flex items-center gap-1 transition active:scale-95 ${
                  finance.isPartnerLoanPausedThisMonth
                    ? 'bg-amber-500/20 text-amber-600 dark:text-amber-300 border border-amber-500/30'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200'
                }`}
                title="Monatsrate für diesen Monat pausieren oder aktivieren"
              >
                <Icon name={finance.isPartnerLoanPausedThisMonth ? 'play' : 'pause'} size={12} />
                <span>
                  {finance.isPartnerLoanPausedThisMonth
                    ? 'Pausiert (0 €)'
                    : `${formatEUR(finance.effectivePartnerLoanRateThisMonth)} / Mon.`}
                </span>
              </button>
            </div>
          </div>

          {/* PROBLEM 6: ATMENDES DYNAMISCHES PUFFER-BUDGET (2x TASCHENGELD HEBEL) */}
          <div className="rounded-3xl p-4 bg-gradient-to-br from-cyan-950/90 via-slate-900 to-slate-900 border border-cyan-500/30 text-white shadow-md space-y-3">
            <div className="flex items-start justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-cyan-500/20 text-cyan-300 flex items-center justify-center shrink-0">
                  <Icon name="sparkles" size={18} />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-200">
                      Dynamischer 2× Puffer-Topf
                    </h2>
                    <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                      2× Taschengeld-Hebel
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-300">
                    Für außerplanmäßige Anschaffungen (Baumarkt, Autoteile, Möbel)
                  </p>
                </div>
              </div>

              <button
                onClick={() => onOpenModal('expense', { scope: 'buffer' })}
                className="px-2.5 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-[11px] shrink-0 active:scale-95 transition"
              >
                + Puffer-Kauf
              </button>
            </div>

            {/* 3-Zonen-Liquiditäts-Cockpit */}
            <div className="grid grid-cols-3 gap-2 pt-1">
              <div className="p-2.5 rounded-2xl bg-white/5 border border-white/10">
                <span className="text-[9px] uppercase font-bold text-slate-400 block">
                  1. Brutto-Deckel
                </span>
                <span className="font-mono font-bold text-xs text-white block mt-0.5">
                  {formatEUR(finance.bufferMaxCapacity)}
                </span>
                <span className="text-[9px] text-cyan-300/80 block">
                  2× {formatEUR(finance.basePocketMoneyBeforeBuffer)}
                  {finance.bufferRolloverBoost > 0 ? ` + ${formatEUR(finance.bufferRolloverBoost)}` : ''}
                </span>
              </div>

              <div className="p-2.5 rounded-2xl bg-white/5 border border-white/10">
                <span className="text-[9px] uppercase font-bold text-slate-400 block">
                  2. Genutzt (50:50)
                </span>
                <span className="font-mono font-bold text-xs text-amber-300 block mt-0.5">
                  {formatEUR(finance.spentBufferTotal)}
                </span>
                <span className="text-[9px] text-slate-400 block">
                  Dein 50% Teil: {formatEUR(finance.partnerABufferShare)}
                </span>
              </div>

              <div className="p-2.5 rounded-2xl bg-cyan-500/15 border border-cyan-500/30">
                <span className="text-[9px] uppercase font-bold text-cyan-200 block">
                  3. Frei verfügbar
                </span>
                <span className="font-mono font-extrabold text-sm text-cyan-300 block mt-0.5">
                  {formatEUR(finance.bufferRemaining)}
                </span>
                <span className="text-[9px] text-cyan-200/80 block">
                  = 2× Netto-TG
                </span>
              </div>
            </div>

            {finance.bufferMaxCapacity <= 0 ? (
              <div className="text-[11px] text-amber-300/90 bg-amber-500/10 border border-amber-500/20 rounded-xl px-3 py-1.5 flex items-center gap-2">
                <Icon name="lock" size={13} />
                <span>
                  Puffer atmet mit deinem Taschengeld: Sobald die Pflichtlücke gedeckt ist (oder du Budget-Überschuss hierher verschiebst), öffnet sich das Limit automatisch.
                </span>
              </div>
            ) : (
              <div className="space-y-1">
                <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 rounded-full transition-all duration-300"
                    style={{
                      width: `${Math.min(100, Math.round((finance.spentBufferTotal / finance.bufferMaxCapacity) * 100))}%`
                    }}
                  />
                </div>
                <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                  <span>Jeder 1 € Puffer-Kauf kostet dich nur 0,50 € Taschengeld</span>
                  <span>{Math.min(100, Math.round((finance.spentBufferTotal / finance.bufferMaxCapacity) * 100))}% ausgeschöpft</span>
                </div>
              </div>
            )}
          </div>

          {/* PROBLEM 3, 4 & 10: DYNAMISCHE ALLTAGS-BUDGETS MIT WOCHEN-PACER & REALLOKATION */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3.5">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Alltags-Budgets (Gemeinschaft)
                </h2>
                <span className="text-[10px] text-slate-400">
                  Dynamische Kategorien • Im Setup frei konfigurierbar
                </span>
              </div>
              {finance.totalUnspentBudgetSurplus > 0 && (
                <button
                  onClick={() => onOpenModal('reallocate')}
                  className="px-2.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30 text-[11px] font-bold flex items-center gap-1 active:scale-95 transition"
                >
                  <Icon name="arrows" size={13} />
                  <span>Überschuss ({formatEUR(finance.totalUnspentBudgetSurplus)}) nutzen</span>
                </button>
              )}
            </div>

            {finance.budgetStats.map((b) => (
              <BudgetBar
                key={b.id}
                icon={b.icon}
                title={b.name}
                spent={b.spent}
                total={b.effectiveTotal}
                baseAmount={b.baseAmount}
                reallocatedOut={b.reallocatedOut}
                reallocatedIn={b.reallocatedIn}
                color={b.color}
                extraBadge={b.extraBadge || (b.isKindergeldLinked ? '1:1 Kindergeld' : '')}
                onReallocateClick={
                  b.remaining > 0
                    ? () => onOpenModal('reallocate', { sourceBudgetId: b.id, maxAmount: b.remaining })
                    : null
                }
                subInfo={
                  b.hasWeeklyPacer ? (
                    <div className="mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px]">
                      <span className="text-slate-500 dark:text-slate-400">
                        KW {finance.liveWeek.weekNo} Pacer ({finance.liveWeek.mondayDisplay}–{finance.liveWeek.sundayDisplay}):
                      </span>
                      <span className={`font-mono font-bold ${
                        b.weeklyRemaining >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'
                      }`}>
                        Noch {formatEUR(b.weeklyRemaining)} diese Woche
                      </span>
                    </div>
                  ) : null
                }
              />
            ))}

            {/* Aktive Reallokationen / Rollovers dieses Monats */}
            {(state.reallocations || []).filter(
              (r) => r.sourceMonthKey === selectedMonthKey || r.targetMonthKey === selectedMonthKey
            ).length > 0 && (
              <div className="pt-2 border-t border-slate-200 dark:border-slate-800 space-y-1.5">
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  Aktive Budget-Reallokationen & Rollovers
                </div>
                {(state.reallocations || [])
                  .filter((r) => r.sourceMonthKey === selectedMonthKey || r.targetMonthKey === selectedMonthKey)
                  .map((r) => {
                    const srcName = (state.config.budgets || []).find((b) => b.id === r.sourceBudgetId)?.name || r.sourceBudgetId;
                    const dstLabel =
                      r.targetType === 'sinking_relief'
                        ? `Tagesgeld-Entlastung (${formatMonthLabel(r.targetMonthKey)})`
                        : r.targetType === 'buffer_boost'
                        ? `2× Puffer-Boost (${formatMonthLabel(r.targetMonthKey)})`
                        : ((state.config.budgets || []).find((b) => b.id === r.targetBudgetId)?.name || 'Budget');
                    return (
                      <div
                        key={r.id}
                        className="flex items-center justify-between px-2.5 py-1.5 rounded-xl bg-emerald-500/5 border border-emerald-500/20 text-[11px]"
                      >
                        <div className="truncate pr-2">
                          <span className="font-bold text-emerald-600 dark:text-emerald-400 font-mono">
                            {formatEUR(r.amount)}
                          </span>{' '}
                          <span className="text-slate-600 dark:text-slate-300">
                            von <b>{srcName}</b> → <b>{dstLabel}</b>
                          </span>
                        </div>
                        <button
                          onClick={() => onDeleteReallocation(r.id)}
                          className="text-slate-400 hover:text-rose-500 shrink-0"
                          title="Umbuchung rückgängig machen"
                        >
                          <Icon name="trash" size={13} />
                        </button>
                      </div>
                    );
                  })}
              </div>
            )}
          </div>

          {/* TRANSAKTIONSLISTE DES MONATS (Alle Scopes: Trinkgeld, Gemeinschaft, Privat A, 2x Puffer) */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                Buchungen ({formatMonthLabel(selectedMonthKey)})
              </h2>
              <span className="text-[10px] font-mono text-slate-400">
                {finance.monthlyTips.length + finance.monthlyExpenses.length} Einträge
              </span>
            </div>

            <div className="space-y-2">
              {/* Trinkgelder */}
              {finance.monthlyTips.map((tip) => (
                <div
                  key={tip.id}
                  className="flex items-center justify-between p-2.5 rounded-2xl bg-emerald-500/5 dark:bg-emerald-500/10 border border-emerald-500/20 text-xs"
                >
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
                      <Icon name="banknote" size={16} />
                    </div>
                    <div>
                      <div className="font-bold text-slate-900 dark:text-white">
                        {tip.note || 'Schicht-Trinkgeld'}
                      </div>
                      <div className="text-[10px] text-slate-500 dark:text-slate-400 font-mono">
                        {tip.date} • Schicht-Einnahme
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="font-mono font-bold text-emerald-600 dark:text-emerald-400">
                      +{formatEUR(tip.amount)}
                    </span>
                    <button
                      onClick={() => onDeleteTip(tip.id)}
                      className="p-1 text-slate-400 hover:text-rose-500 active:scale-95 transition"
                      title="Löschen"
                    >
                      <Icon name="trash" size={14} />
                    </button>
                  </div>
                </div>
              ))}

              {/* Ausgaben (Gemeinschaft, Privat A, Puffer) */}
              {finance.monthlyExpenses.map((exp) => {
                const matchedBudget = (state.config.budgets || []).find((b) => b.id === exp.category);
                const isPrivate = exp.scope === 'private_a';
                const isBuffer = exp.scope === 'buffer';

                const iconName = isPrivate
                  ? 'user'
                  : isBuffer
                  ? 'sparkles'
                  : (matchedBudget?.icon || 'shopping-cart');

                const categoryTitle = isPrivate
                  ? 'Privatausgabe Partner A (100%)'
                  : isBuffer
                  ? '2× Puffer-Anschaffung (50:50)'
                  : (matchedBudget?.name || exp.category);

                const badgeClass = isPrivate
                  ? 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20'
                  : isBuffer
                  ? 'bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border-cyan-500/20'
                  : 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-500/20';

                return (
                  <div
                    key={exp.id}
                    className="flex items-center justify-between p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 text-xs"
                  >
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className={`w-8 h-8 rounded-xl border flex items-center justify-center shrink-0 ${badgeClass}`}>
                        <Icon name={iconName} size={16} />
                      </div>
                      <div className="truncate">
                        <div className="font-bold text-slate-900 dark:text-white truncate">
                          {exp.note || categoryTitle}
                        </div>
                        <div className="text-[10px] text-slate-500 dark:text-slate-400 font-mono flex items-center gap-1.5">
                          <span>{exp.date}</span>
                          <span>•</span>
                          <span className="font-sans font-semibold">{categoryTitle}</span>
                          {!isPrivate && <span>({exp.paymentMethod})</span>}
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <div className="text-right">
                        <span className="font-mono font-bold text-slate-900 dark:text-white block">
                          -{formatEUR(exp.amount)}
                        </span>
                        {isBuffer && (
                          <span className="text-[9px] font-mono text-cyan-500 block">
                            Dein Teil: -{formatEUR(exp.amount * 0.5)}
                          </span>
                        )}
                      </div>
                      <button
                        onClick={() => onDeleteExpense(exp.id)}
                        className="p-1 text-slate-400 hover:text-rose-500 active:scale-95 transition"
                        title="Löschen"
                      >
                        <Icon name="trash" size={14} />
                      </button>
                    </div>
                  </div>
                );
              })}

              {finance.monthlyTips.length === 0 && finance.monthlyExpenses.length === 0 && (
                <div className="text-center py-6 text-xs text-slate-400">
                  Noch keine Buchungen in {formatMonthLabel(selectedMonthKey)} erfasst.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function BudgetBar({
      icon,
      title,
      spent,
      total,
      baseAmount,
      reallocatedOut,
      reallocatedIn,
      color,
      subInfo,
      extraBadge,
      onReallocateClick
    }) {
      const pct = total > 0 ? Math.min(100, Math.round((spent / total) * 100)) : 0;
      const remaining = total - spent;
      const isOver = remaining < 0;

      const colorMap = {
        indigo: 'bg-indigo-500',
        amber: 'bg-amber-500',
        blue: 'bg-blue-500',
        emerald: 'bg-emerald-500',
        rose: 'bg-rose-500',
        violet: 'bg-violet-500',
        cyan: 'bg-cyan-500'
      };

      return (
        <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-800/80">
          <div className="flex items-center justify-between mb-1.5 gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <Icon name={icon} size={16} className="text-slate-500 dark:text-slate-400 shrink-0" />
              <span className="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">{title}</span>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              {extraBadge && (
                <span className="text-[9px] font-semibold px-2 py-0.5 rounded-full bg-slate-200/80 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                  {extraBadge}
                </span>
              )}
              {onReallocateClick && (
                <button
                  onClick={onReallocateClick}
                  className="px-2 py-0.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold flex items-center gap-1 transition"
                  title="Unverbrauchten Restbetrag umbuchen / Rollover"
                >
                  <Icon name="arrows" size={11} />
                  <span>Rollover</span>
                </button>
              )}
            </div>
          </div>

          <div className="flex items-baseline justify-between text-xs font-mono mb-1.5">
            <span className="font-bold text-slate-900 dark:text-white">
              {formatEUR(spent)}{' '}
              <span className="text-[10px] text-slate-400 font-normal">
                von {formatEUR(total)}
                {(reallocatedOut > 0 || reallocatedIn > 0) && ` (Basis ${formatEUR(baseAmount)})`}
              </span>
            </span>
            <span className={`font-bold ${isOver ? 'text-rose-500' : 'text-slate-500 dark:text-slate-400'}`}>
              {isOver ? `Überzug ${formatEUR(Math.abs(remaining))}` : `Rest ${formatEUR(remaining)}`}
            </span>
          </div>

          <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
            <div
              className={`h-full ${isOver ? 'bg-rose-500' : (colorMap[color] || 'bg-indigo-500')} rounded-full transition-all duration-300`}
              style={{ width: `${pct}%` }}
            />
          </div>

          {subInfo}
        </div>
      );
    }

    // ============================================================================
    // 7. SCREEN 2: DARLEHENS-COCKPIT (PROBLEM 7) & "PAY IN 30 DAYS" MANAGER
    // ============================================================================
    function PayIn30Screen({
      state,
      finance,
      selectedMonthKey,
      onAddPayIn30,
      onMarkSettled,
      onDeletePayIn30,
      onTogglePartnerLoanPause,
      onOpenExtraPaymentModal,
      onDeleteExtraPayment
    }) {
      const [showAddForm, setShowAddForm] = useState(false);
      const [merchant, setMerchant] = useState('');
      const [item, setItem] = useState('');
      const [amount, setAmount] = useState('');
      const [purchaseDate, setPurchaseDate] = useState(() => getTodayISO());
      const [dueDate, setDueDate] = useState(() => addDaysISO(getTodayISO(), 30));

      const handleAddSubmit = (e) => {
        e.preventDefault();
        onAddPayIn30({
          merchant,
          item,
          amount,
          purchaseDate,
          dueDate
        });
        setMerchant('');
        setItem('');
        setAmount('');
        setShowAddForm(false);
      };

      const loanProgressPct = finance.loanTotalAmount > 0
        ? Math.min(100, Math.round((finance.totalRepaidSoFar / finance.loanTotalAmount) * 100))
        : 100;

      return (
        <div className="space-y-4">
          {/* PROBLEM 7: AUTO-DARLEHENS-LEBENSZYKLUS & TILGUNGS-AUSSETZUNG (AN PARTNERIN B) */}
          <div className="rounded-3xl p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 border border-indigo-500/30 text-white shadow-lg space-y-3.5">
            <div className="flex items-start justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center shrink-0">
                  <Icon name="car" size={19} />
                </div>
                <div>
                  <h2 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                    {finance.partnerLoan.name}
                  </h2>
                  <div className="text-xl font-black font-mono text-white">
                    Restschuld: {formatEUR(finance.partnerLoanRemainingDebt)}
                  </div>
                </div>
              </div>

              <button
                onClick={onOpenExtraPaymentModal}
                className="px-2.5 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 text-[11px] font-bold active:scale-95 transition"
              >
                + Sonderzahlung
              </button>
            </div>

            {/* Tilgungs-Fortschritt */}
            <div className="space-y-1">
              <div className="flex justify-between text-[11px] text-slate-300 font-mono">
                <span>Getilgt: {formatEUR(finance.totalRepaidSoFar)} ({loanProgressPct}%)</span>
                <span>Kreditsumme: {formatEUR(finance.loanTotalAmount)}</span>
              </div>
              <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden border border-white/10">
                <div
                  className="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 rounded-full transition-all duration-500"
                  style={{ width: `${loanProgressPct}%` }}
                />
              </div>
              <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                <span>Reguläre Rate: {formatEUR(finance.loanRegularRate)} / Mon.</span>
                <span>Noch ca. {finance.partnerLoanRemainingMonths} Raten</span>
              </div>
            </div>

            {/* Monatsbezogener Tilgungsstatus-Umschalter */}
            <div className="p-3 rounded-2xl bg-black/30 border border-white/10 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold text-slate-200">
                  Status für {formatMonthLabel(selectedMonthKey)}:
                </span>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                  finance.isPartnerLoanPausedThisMonth
                    ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                    : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                }`}>
                  {finance.isPartnerLoanPausedThisMonth ? '⏸ Diesen Monat ausgesetzt' : '✓ Regulär bedient'}
                </span>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => finance.isPartnerLoanPausedThisMonth && onTogglePartnerLoanPause()}
                  className={`py-2 px-2.5 rounded-xl text-[11px] font-bold border transition flex items-center justify-center gap-1.5 ${
                    !finance.isPartnerLoanPausedThisMonth
                      ? 'bg-emerald-600 text-white border-emerald-500 shadow'
                      : 'bg-white/5 text-slate-400 border-white/10 hover:bg-white/10'
                  }`}
                >
                  <Icon name="check" size={13} />
                  <span>Regulär ({formatEUR(finance.loanRegularRate)})</span>
                </button>
                <button
                  onClick={() => !finance.isPartnerLoanPausedThisMonth && onTogglePartnerLoanPause()}
                  className={`py-2 px-2.5 rounded-xl text-[11px] font-bold border transition flex items-center justify-center gap-1.5 ${
                    finance.isPartnerLoanPausedThisMonth
                      ? 'bg-amber-600 text-white border-amber-500 shadow'
                      : 'bg-white/5 text-slate-400 border-white/10 hover:bg-white/10'
                  }`}
                >
                  <Icon name="pause" size={13} />
                  <span>Pausieren (0 € Pflicht)</span>
                </button>
              </div>

              {finance.isPartnerLoanPausedThisMonth && (
                <p className="text-[10px] text-amber-300/90 leading-relaxed">
                  Die Rate von {formatEUR(finance.loanRegularRate)} wurde für {formatMonthLabel(selectedMonthKey)} vollständig aus deiner Monats-Pflichtlast gestrichen und als Rückstand vermerkt.
                </p>
              )}
            </div>

      const handleAddFundSubmit = (e) => {
        e.preventDefault();
        const val = parseDecimal(fundAmount);
        const div = parseInt(fundDivisor, 10) || 12;
        if (!fundName || val <= 0) return;
        const newFund = {
          id: 'sf-' + Date.now(),
          name: fundName,
          fullAmount: val,
          divisor: div,
          note: div === 12 ? 'Jahresbeitrag / 12' : `Alle ${div} Monate / ${div}`
        };
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            sinkingFunds: [...(prev.config.sinkingFunds || []), newFund]
          }
        }));
        setFundName('');
        setFundAmount('');
        setShowAddFund(false);
        showNotification('Neue Rücklage hinzugefügt!');
      };

      const removeFund = (id) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            sinkingFunds: (prev.config.sinkingFunds || []).filter((f) => f.id !== id)
          }
        }));

      return (

                    {formatEUR(finance.sinkingMonthlyEffective)} / Monat

                  {finance.sinkingReliefThisMonth > 0 && (
                    <span className="text-[10px] text-emerald-300 font-mono block">

                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="font-mono font-bold text-indigo-600 dark:text-indigo-400">
                        {formatEUR(monthly)} / Mon.
                      </span>
                      <button
                        onClick={() => removeFund(f.id)}
                        className="p-1 text-slate-400 hover:text-rose-500"
                      >
                        <Icon name="trash" size={14} />
                      </button>
                    </div>
                  </div>
                );

              }`}>
                <span className="text-[9px] font-bold uppercase block">Netto-Ausgleich</span>
                <span className="font-mono font-extrabold text-xs block">
                  {finance.netBalanceForA > 0

                  {finance.netBalanceForA > 0

      const [newLoanName, setNewLoanName] = useState('');
      const [newLoanAmount, setNewLoanAmount] = useState('');
      const [newLoanMonths, setNewLoanMonths] = useState('12');

      // CRUD State für Private Abos
      const [newAboName, setNewAboName] = useState('');
      const [newAboAmount, setNewAboAmount] = useState('');

      const [confirmMonthReset, setConfirmMonthReset] = useState(false);
      const [showPwaViewer, setShowPwaViewer] = useState(null);

      const c = state.config;

      const updateConfigField = (key, rawValue) => {
        const val = parseDecimal(rawValue);
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            [key]: val
          }
        }));
      };

      const updatePartnerLoanField = (field, rawValue) => {
        const val = field === 'name' ? rawValue : parseDecimal(rawValue);
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            partnerLoan: {
              ...(prev.config.partnerLoan || {}),
              [field]: val
            }
          }
        }));
      };

      // Problem 3 & 4: Dynamische Budgets hinzufügen / bearbeiten / löschen
      const handleAddBudget = (e) => {
        e.preventDefault();
        const val = parseDecimal(newBudgetAmount);
        if (!newBudgetName.trim() || val < 0) return;
        const newB = {
          id: 'bgt-' + Date.now(),
          name: newBudgetName.trim(),
          amount: val,
          icon: newBudgetIcon,
          color: newBudgetColor,
          hasWeeklyPacer: newBudgetPacer,
          isKindergeldLinked: false,
          extraBadge: ''
        };
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            budgets: [...(prev.config.budgets || []), newB]
          }
        }));
        setNewBudgetName('');
        setNewBudgetAmount('');
        setNewBudgetPacer(false);
        showNotification(`Budget "${newB.name}" angelegt!`);
      };

      const handleUpdateBudget = (id, patch) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            budgets: (prev.config.budgets || []).map((b) =>
              b.id === id ? { ...b, ...patch } : b
            )
          }
        }));
      };

      const handleDeleteBudget = (id) => {
        if ((c.budgets || []).length <= 1) {
          showNotification('Mindestens ein Alltagsbudget muss bestehen bleiben.', 'info');
          return;
        }
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            budgets: (prev.config.budgets || []).filter((b) => b.id !== id)
          }
        }));
        showNotification('Budget-Kategorie gelöscht (Historie bleibt erhalten)', 'info');
      };

      // Problem 8: Endliche Ratenkredite hinzufügen / bearbeiten / löschen
      const handleAddPrivateLoan = (e) => {
        e.preventDefault();
        const val = parseDecimal(newLoanAmount);
        const months = Math.max(1, parseInt(newLoanMonths, 10) || 1);
        if (!newLoanName.trim() || val <= 0) return;
        const newLoan = {
          id: 'loan-' + Date.now(),
          name: newLoanName.trim(),
          amount: val,
          remainingMonths: months,
          totalAmount: Math.round(val * months * 100) / 100
        };
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateLoans: [...(prev.config.privateLoans || []), newLoan]
          }
        }));
        setNewLoanName('');
        setNewLoanAmount('');
        setNewLoanMonths('12');
        showNotification(`Ratenkredit "${newLoan.name}" hinzugefügt!`);
      };

      const handleUpdatePrivateLoan = (id, patch) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateLoans: (prev.config.privateLoans || []).map((l) => {
              if (l.id !== id) return l;
              const updated = { ...l, ...patch };
              updated.totalAmount = Math.round((Number(updated.amount) || 0) * (Number(updated.remainingMonths) || 0) * 100) / 100;
              return updated;
            })
          }
        }));
      };

      const handleRemovePrivateLoan = (id) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateLoans: (prev.config.privateLoans || []).filter((l) => l.id !== id)
          }
        }));
        showNotification('Ratenverpflichtung entfernt!', 'info');
      };

      // Private Abonnements
      const addPrivateAbo = (e) => {
        e.preventDefault();
        const val = parseDecimal(newAboAmount);
        if (!newAboName.trim() || val <= 0) return;
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateAbos: [
              ...(prev.config.privateAbos || []),
              { id: 'abo-' + Date.now(), name: newAboName.trim(), amount: val }
            ]
          }
        }));
        setNewAboName('');
        setNewAboAmount('');
        showNotification('Privates Abonnement hinzugefügt!');
      };

      const removePrivateAbo = (id) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateAbos: (prev.config.privateAbos || []).filter((a) => a.id !== id)
          }
        }));
      };

      // Backup Export & Import (inkl. automatischer V1->V2 Schema-Migration beim Import)
      const handleExportJSON = () => {
        try {
          const dataStr = JSON.stringify(state, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `flowpilot-v2-backup-${getTodayISO()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showNotification('JSON-Backup (Schema v2) heruntergeladen!');
        } catch (err) {
          showNotification('Fehler beim Backup-Export', 'error');
        }
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported && (imported.config || imported.tips)) {
              const migrated = migrateStateToV2(imported);
              setState(migrated);
              showNotification('Backup erfolgreich importiert & auf Schema v2 migriert!');
            } else {
              showNotification('Ungültige Backup-Datei!', 'error');
            }
          } catch (err) {
            showNotification('JSON konnte nicht gelesen werden!', 'error');
          }
        };
        reader.readAsText(file);
      };

      const downloadTextFile = (filename, content, mimeType) => {
        try {
          const blob = new Blob([content], { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showNotification(`${filename} heruntergeladen!`);
        } catch (err) {
          showNotification(`Fehler beim Speichern von ${filename}`, 'error');
        }
      };

      const copyToClipboard = (text, label) => {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-999999px';
          textArea.style.top = '-999999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showNotification(`${label} in die Zwischenablage kopiert!`);
        } catch (err) {
          showNotification('Kopieren fehlgeschlagen', 'error');
        }
      };

      return (
        <div className="space-y-4">
          {/* 1. GEMEINSCHAFTSKONTO (ING) & ENTLASTUNGEN (Problem 1 gelöst durch Focus-Lock Input) */}
          <section className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3">
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                1. Wohn- & Nebenkosten (Stufe 1 Gemeinschaft)
              </h3>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Entkoppelte Direkt-Eingabe (Komma & freies Editieren ohne Cursor-Sprung)
              </p>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <SettingNumberField
                label="Warmmiete (Gesamt)"
                value={c.warmmiete}
                onChange={(v) => updateConfigField('warmmiete', v)}
              />
              <SettingNumberField
                label="Wohngeld (Entlastung)"
                value={c.wohngeld}
                onChange={(v) => updateConfigField('wohngeld', v)}
                highlight="emerald"
              />
              <SettingNumberField
                label="Strom, Gas & Internet"
                value={c.stromHeizungInternet}
                onChange={(v) => updateConfigField('stromHeizungInternet', v)}
              />
              <SettingNumberField
                label="Kindergeld (Anrechnung)"
                value={c.kindergeld}
                onChange={(v) => updateConfigField('kindergeld', v)}
                highlight="emerald"
              />
              <SettingNumberField
                label="Sonstige Gem.-Fixkosten"
                value={c.sonstigeGemeinschaftFix}
                onChange={(v) => updateConfigField('sonstigeGemeinschaftFix', v)}
              />
              <SettingNumberField
                label="Tagesgeld-Bestand (ING)"
                value={c.tagesgeldBalance}
                onChange={(v) => updateConfigField('tagesgeldBalance', v)}
                highlight="indigo"
              />
            </div>

            <label className="flex items-center gap-2.5 p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 cursor-pointer text-xs">
              <input
                type="checkbox"
                checked={c.includeSinkingInJoint}
                onChange={(e) =>
                  setState((prev) => ({
                    ...prev,
                    config: { ...prev.config, includeSinkingInJoint: e.target.checked }
                  }))
                }
                className="rounded text-indigo-600 focus:ring-indigo-500"
              />
              <span className="text-[11px] font-medium leading-tight">
                Stufe 3 Sinking-Funds-Rate ({formatEUR(finance.sinkingMonthlyEffective)}) in 50:50 Gemeinschafts-Soll einbeziehen
              </span>
            </label>
          </section>

          {/* 2. DYNAMISCHE ALLTAGS-BUDGETS CRUD (Problem 3 & 4) */}
          <section className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3.5">
            <div className="flex items-center justify-between">
              <div>

                  2. Dynamische Alltags-Budgets (Stufe 2)

                <p className="text-[11px] text-slate-500 dark:text-slate-400">

                </p>
              </div>
              <span className="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400">
                Σ {formatEUR(finance.grossDynamicBudgetsTotal)}
              </span>
            </div>

            <div className="space-y-2.5">
              {(c.budgets || []).map((b) => (
                <div
                  key={b.id}
                  className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 space-y-2"
                >
                  <div className="grid grid-cols-12 gap-2 items-center">
                    <div className="col-span-7">
                      <label className="text-[9px] font-bold uppercase text-slate-400 block mb-0.5">
                        Kategorie-Name
                      </label>
                      <input
                        type="text"
                        value={b.name}
                        onChange={(e) => handleUpdateBudget(b.id, { name: e.target.value })}
