self.addEventListener('activate', (event) => {
  event.waitUntil(

        keys.map((key) => {
          if (key !== CACHE_NAME) {
            console.log('[SW] Entferne veralteten Cache:', key);
            return caches.delete(key);
          }
        })
      );
    }).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  if (event.request.method !== 'GET') return;

  event.respondWith(
    caches.match(event.request).then((cachedResponse) => {
      if (cachedResponse) {
        return cachedResponse;
      }
      return fetch(event.request).then((networkResponse) => {
        if (!networkResponse || networkResponse.status !== 200 || networkResponse.type === 'error') {
          return networkResponse;
        }
        const responseToCache = networkResponse.clone();
        caches.open(CACHE_NAME).then((cache) => {
          cache.put(event.request, responseToCache);

        return networkResponse;
      }).catch(() => {
        if (event.request.mode === 'navigate') {
          return caches.match('./index.html');
        }
      });
    })
  );

    const STORAGE_KEY = 'flowpilot_partner_a_v1';

    const parseDecimal = (val) => {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (!val) return 0;
      const cleaned = String(val).replace(/\s/g, '').replace(',', '.');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : Math.round(num * 100) / 100;
    };

    const formatEUR = (val, showSign = false) => {
      const num = Number(val) || 0;
      const formatted = new Intl.NumberFormat('de-DE', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(num);
      if (showSign && num > 0) return `+${formatted}`;
      return formatted;
    };

    const getTodayISO = () => {
      try {
        return new Date().toISOString().split('T')[0];
      } catch (e) {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }
    };

    const getCurrentMonthKey = () => {
      return getTodayISO().slice(0, 7);
    };

    const formatMonthLabel = (monthKey) => {
      if (!monthKey || !monthKey.includes('-')) return '';
      const [y, m] = monthKey.split('-').map(Number);
      const d = new Date(y, m - 1, 1);
      return d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    };

    const shiftMonthKey = (monthKey, delta) => {
      const [y, m] = (monthKey || getCurrentMonthKey()).split('-').map(Number);
      let newY = y;
      let newM = m + delta;
      while (newM < 1) {
        newM += 12;
        newY -= 1;
      }
      while (newM > 12) {
        newM -= 12;
        newY += 1;
      }
      return `${newY}-${String(newM).padStart(2, '0')}`;
    };

    const addDaysISO = (dateStr, days) => {
      const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      base.setDate(base.getDate() + days);
      const yyyy = base.getFullYear();
      const mm = String(base.getMonth() + 1).padStart(2, '0');
      const dd = String(base.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const getDaysUntil = (dueDateStr) => {
      if (!dueDateStr) return 0;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueDateStr + 'T00:00:00');
      const diffMs = due.getTime() - today.getTime();
      return Math.round(diffMs / (1000 * 60 * 60 * 24));
    };

    const getLiveWeekRange = () => {
      const now = new Date();
      const cur = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const day = cur.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      const monday = new Date(cur);
      monday.setDate(cur.getDate() + diffToMonday);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const toISO = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dd}`;
      };

      const target = new Date(cur.valueOf());
      const dayNr = (cur.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
      }
      const weekNo = 1 + Math.ceil((firstThursday - target) / 604800000);

      return {
        weekNo,
        mondayISO: toISO(monday),
        sundayISO: toISO(sunday),
        mondayDisplay: monday.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }),
        sundayDisplay: sunday.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })
      };
    };

    const getInitialState = () => {
      const today = getTodayISO();
      return {
        theme: 'dark',
        monthlySalaries: {},
        config: {
          warmmiete: 1180.00,
          stromHeizungInternet: 210.00,
          sonstigeGemeinschaftFix: 45.00,
          includeSinkingInJoint: true,
          wohngeld: 470.00,
          kindergeld: 259.00,
          budgetSupermarkt: 600.00,
          budgetAuswaerts: 120.00,
          budgetEAuto: 110.00,
          budgetBaby: 259.00,
          expectedSalary15th: 1650.00,
          actualSalary15th: 1650.00,
          salaryConfirmed: true,
          rateAutoPartnerin: 160.00,
          rateKfw: 135.00,
          rateKuehlschrank: 45.00,
          privateAbos: [
            { id: 'abo-1', name: 'YouTube Premium', amount: 12.99 },
            { id: 'abo-2', name: 'Mobilfunkvertrag', amount: 19.99 },
            { id: 'abo-3', name: 'Cloud & Streaming', amount: 9.99 }
          ],
          tagesgeldBalance: 1420.00,
          sinkingFunds: [
            { id: 'sf-1', name: 'Kfz-Vollkasko (E-Auto)', cycle: 'yearly', fullAmount: 780.00, divisor: 12, note: 'Jahresbeitrag / 12' },
            { id: 'sf-2', name: 'GEZ / Rundfunkbeitrag', cycle: 'quarterly', fullAmount: 55.08, divisor: 3, note: '55,08 € vierteljährlich / 3' },
            { id: 'sf-3', name: 'Haftpflicht & Hausrat', cycle: 'yearly', fullAmount: 192.00, divisor: 12, note: 'Jahresbeitrag / 12' }
          ]
        },
        tips: [
          { id: 'tip-1', date: today, amount: 65.00, note: 'Spätschicht' },
          { id: 'tip-2', date: today, amount: 85.00, note: 'Wochenend-Schicht' },
          { id: 'tip-3', date: today, amount: 55.00, note: 'Frühschicht' }
        ],
        expenses: [
          { id: 'exp-1', date: today, category: 'supermarkt', amount: 84.50, paymentMethod: 'Gemeinschaftskarte', note: 'Wocheneinkauf DM & Rewe' },
          { id: 'exp-2', date: today, category: 'auswaerts', amount: 32.00, paymentMethod: 'Gemeinschaftskarte', note: 'Pizza bestellt' },
          { id: 'exp-3', date: today, category: 'baby', amount: 46.80, paymentMethod: 'Gemeinschaftskarte', note: 'Windeln & Pre-Nahrung' },
          { id: 'exp-4', date: today, category: 'eauto', amount: 0.00, paymentMethod: 'Gemeinschaftskarte', note: 'Ladekosten Sammelrechnung (Monatsende)' }
        ],
        payIn30: [
          {
            id: 'p30-1',
            merchant: 'Baby-Walz (PayPal 30 Tage)',
            item: 'Winterfußsack Kinderwagen',
            amount: 79.90,
            purchaseDate: today,
            dueDate: addDaysISO(today, 12),
            includeInCurrentMonthPflicht: true,
            settled: false
          },
          {
            id: 'p30-2',
            merchant: 'Klarna / Zalando',
            item: 'Arbeitsschuhe für Schicht',
            amount: 64.00,
            purchaseDate: today,
            dueDate: addDaysISO(today, 24),
            includeInCurrentMonthPflicht: true,
            settled: false
          }
        ],
        kleinanzeigen: [
          {
            id: 'ka-1',
            date: today,
            title: 'Kleinanzeigen: Baby-Beistellbett',
            amount: 70.00,
            paidBy: 'A',
            splitPercentA: 50,
            settled: false
          },
          {
            id: 'ka-2',
            date: today,
            title: 'Kleinanzeigen: Krabbeldecke & Spielbogen',
            amount: 30.00,
            paidBy: 'B',
            splitPercentA: 50,
            settled: false
          }
        ]
      };
    };

    // ============================================================================
    // 3. MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const currentMonthKey = getCurrentMonthKey();
      const [selectedMonthKey, setSelectedMonthKey] = useState(currentMonthKey);

      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              ...getInitialState(),
              ...parsed,
              config: { ...getInitialState().config, ...(parsed.config || {}) },
              monthlySalaries: parsed.monthlySalaries || {}
            };
          }
        } catch (err) {
          console.error('Fehler beim Laden aus localStorage:', err);
        }
        return getInitialState();
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [modalType, setModalType] = useState(null);
      const [showFormulaDetails, setShowFormulaDetails] = useState(false);
      const [toast, setToast] = useState(null);
      const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
      const [isInstalledPwa, setIsInstalledPwa] = useState(false);

      // Save to localStorage (single, robust useEffect)
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.error('Fehler beim Speichern in localStorage:', err);
        }
      }, [state]);

      // Apply theme
      useEffect(() => {
        const root = document.documentElement;
        if (state.theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [state.theme]);

      // Service Worker & Android Install Prompt
      useEffect(() => {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        setIsInstalledPwa(isStandalone);

        // Service Worker direkt registrieren (ohne auf 'load' zu warten)
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker
            .register('./sw.js')
            .then((registration) => {
              console.log('FlowPilot Service Worker aktiv:', registration.scope);
            })
            .catch((error) => {
              console.error('Service Worker Fehler:', error.message);
            });
        }

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredInstallPrompt(e);
        };

        const handleAppInstalled = () => {
          setIsInstalledPwa(true);
          setDeferredInstallPrompt(null);
          showNotification('FlowPilot wurde auf dem Smartphone installiert!');
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        window.addEventListener('appinstalled', handleAppInstalled);

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
          window.removeEventListener('appinstalled', handleAppInstalled);
        };
      }, []);
      const showNotification = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast((prev) => (prev && prev.message === message ? null : prev));
        }, 3200);
      };

      const handleTriggerInstall = async () => {
        if (!deferredInstallPrompt) {
          showNotification('Tippe im Browser-Menü auf "App installieren"', 'info');
          return;
        }
        try {
          deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          if (choice && choice.outcome === 'accepted') {
            showNotification('Installation auf Android gestartet...');
          }
        } catch (err) {
          console.error('Install Prompt Fehler:', err);
        }
        setDeferredInstallPrompt(null);
      };

      // ==========================================================================
      // 4. CORE FINANCIAL ENGINE (Strikt gefiltert nach selectedMonthKey)
      // ==========================================================================
      const finance = useMemo(() => {
        const c = state.config;
        const isCurrentMonth = selectedMonthKey === currentMonthKey;

        // A. Sinking Funds Dauerübertrag
        const sinkingMonthlyTotal = (c.sinkingFunds || []).reduce((acc, item) => {
          const div = Number(item.divisor) || 12;
          return acc + (Number(item.fullAmount) || 0) / div;
        }, 0);

        // B. Gemeinschaftskonto ING
        const netHousingCost = Math.max(0, (Number(c.warmmiete) || 0) - (Number(c.wohngeld) || 0));
        const jointFixedOther =
          (Number(c.stromHeizungInternet) || 0) +
          (Number(c.sonstigeGemeinschaftFix) || 0) +
          (c.includeSinkingInJoint ? sinkingMonthlyTotal : 0);

        const netBabyBudgetCost = Math.max(0, (Number(c.budgetBaby) || 0) - (Number(c.kindergeld) || 0));

        const grossJointTotal =
          (Number(c.warmmiete) || 0) +
          jointFixedOther +
          (Number(c.budgetSupermarkt) || 0) +
          (Number(c.budgetAuswaerts) || 0) +
          (Number(c.budgetEAuto) || 0) +
          (Number(c.budgetBaby) || 0);

        const stateReliefTotal = (Number(c.wohngeld) || 0) + (Number(c.kindergeld) || 0);
        const remainingJointToSplit = Math.max(0, grossJointTotal - stateReliefTotal);
        const partnerAJointShare = remainingJointToSplit / 2;

        // C. Private Pflichtausgaben Partner A
        const privateAbosTotal = (c.privateAbos || []).reduce((sum, a) => sum + (Number(a.amount) || 0), 0);

        const openPayIn30Items = (state.payIn30 || []).filter((item) => !item.settled);
        const settledPayIn30Items = (state.payIn30 || []).filter((item) => item.settled);

        // Fällige Verbindlichkeiten im gewählten Monat
        const duePayIn30Total = openPayIn30Items
          .filter((item) => item.dueDate && item.dueDate.startsWith(selectedMonthKey))
          .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const lockedPayIn30Total = openPayIn30Items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

        const privateMandatoryBase =
          (Number(c.rateAutoPartnerin) || 0) +
          (Number(c.rateKfw) || 0) +
          (Number(c.rateKuehlschrank) || 0) +
          privateAbosTotal;

        const privateMandatoryTotal = privateMandatoryBase + duePayIn30Total;

        // D. Gesamt-Pflichtlast
        const gesamtPflichtlast = partnerAJointShare + privateMandatoryTotal;

        // Gehaltseingang 15.
        const monthSalaryData = state.monthlySalaries?.[selectedMonthKey];
        const salaryConfirmed = monthSalaryData?.confirmed !== undefined
          ? monthSalaryData.confirmed
          : (isCurrentMonth ? c.salaryConfirmed : false);

        const effectiveSalary15 = monthSalaryData?.actual !== undefined
          ? (salaryConfirmed ? monthSalaryData.actual : (Number(c.expectedSalary15th) || 0))
          : (c.salaryConfirmed ? (Number(c.actualSalary15th) || 0) : (Number(c.expectedSalary15th) || 0));

        const pflichtLueckeNachGehalt = Math.max(0, gesamtPflichtlast - effectiveSalary15);
        const salarySurplus = Math.max(0, effectiveSalary15 - gesamtPflichtlast);

        // Schicht-Trinkgelder des Monats
        const monthlyTips = (state.tips || []).filter(
          (t) => t.date && t.date.startsWith(selectedMonthKey)
        );
        const totalTips = monthlyTips.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

        // E. Offenes Pflicht-Einzahlungs-Soll
        const offenesPflichtSoll = Math.max(0, pflichtLueckeNachGehalt - totalTips);
        const coveredByTips = Math.min(pflichtLueckeNachGehalt, totalTips);
        const pflichtProgressPercent =
          pflichtLueckeNachGehalt <= 0
            ? 100
            : Math.min(100, Math.round((coveredByTips / pflichtLueckeNachGehalt) * 100));

        const isPflichtCovered = offenesPflichtSoll <= 0.004;

        // F. Freiverfügbares Bargeld / Taschengeld
        const grossFreePocketMoney = Math.max(0, totalTips - pflichtLueckeNachGehalt) + salarySurplus;
        const netFreePocketMoney = Math.max(0, grossFreePocketMoney);

        // G. Ausgaben & Wochen-Pacer
        const monthlyExpenses = (state.expenses || []).filter(
          (e) => e.date && e.date.startsWith(selectedMonthKey)
        );
        const sumByCategory = (cat) =>
          monthlyExpenses
            .filter((e) => e.category === cat)
            .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);

        const spentSupermarkt = sumByCategory('supermarkt');
        const spentAuswaerts = sumByCategory('auswaerts');
        const spentEAuto = sumByCategory('eauto');
        const spentBaby = sumByCategory('baby');

        // Dynamischer Wochen-Pacer
        const liveWeek = getLiveWeekRange();
        const spentSupermarktThisWeek = (state.expenses || [])
          .filter(
            (e) =>
              e.category === 'supermarkt' &&
              e.date >= liveWeek.mondayISO &&
              e.date <= liveWeek.sundayISO
          )
          .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);

        const [selYear, selMonth] = selectedMonthKey.split('-').map(Number);
        const daysInSelectedMonth = new Date(selYear, selMonth, 0).getDate();
        const weeksInMonth = daysInSelectedMonth / 7;
        const weeklySupermarktAllowance = (Number(c.budgetSupermarkt) || 0) / weeksInMonth;
        const weeklySupermarktRemaining = weeklySupermarktAllowance - spentSupermarktThisWeek;

        // H. Kleinanzeigen Saldo
        const openKleinanzeigen = (state.kleinanzeigen || []).filter((k) => !k.settled);
        let netBalanceForA = 0;
        openKleinanzeigen.forEach((item) => {
          const amt = Number(item.amount) || 0;
          const shareAPercent = Number(item.splitPercentA ?? 50) / 100;
          const shareBPercent = 1 - shareAPercent;
          if (item.paidBy === 'A') {
            netBalanceForA += amt * shareBPercent;
          } else {
            netBalanceForA -= amt * shareAPercent;
          }
        });

        return {
          isCurrentMonth,
          sinkingMonthlyTotal,
          netHousingCost,
          jointFixedOther,
          grossJointTotal,
          stateReliefTotal,
          remainingJointToSplit,
          partnerAJointShare,
          privateAbosTotal,
          privateMandatoryBase,
          duePayIn30Total,
          lockedPayIn30Total,
          privateMandatoryTotal,
          gesamtPflichtlast,
          effectiveSalary15,
          salaryConfirmed,
          pflichtLueckeNachGehalt,
          totalTips,
          monthlyTips,
          monthlyExpenses,
          offenesPflichtSoll,
          coveredByTips,
          pflichtProgressPercent,
          isPflichtCovered,
          netFreePocketMoney,
          liveWeek,
          spentSupermarkt,
          spentAuswaerts,
          spentEAuto,
          spentBaby,
          spentSupermarktThisWeek,
          weeklySupermarktAllowance,
          weeklySupermarktRemaining,
          openPayIn30Items,
          settledPayIn30Items,
          openKleinanzeigen,
          netBalanceForA
        };
      }, [state, selectedMonthKey, currentMonthKey]);

      // ==========================================================================
      // 5. ACTION HANDLERS
      // ==========================================================================
      const toggleTheme = () => {
        setState((prev) => ({
          ...prev,
          theme: prev.theme === 'dark' ? 'light' : 'dark'
        }));
      };

      const addTip = (amount, date, note) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const tipDate = date || getTodayISO();
        const newTip = {
          id: 'tip-' + Date.now(),
          date: tipDate,
          amount: val,
          note: note || 'Schicht-Trinkgeld'
        };
        setState((prev) => ({
          ...prev,
          tips: [newTip, ...(prev.tips || [])]
        }));
        showNotification(`+${formatEUR(val)} Schicht-Trinkgeld für ${tipDate} verbucht!`);
      };

      const deleteTip = (id) => {
        setState((prev) => ({
          ...prev,
          tips: (prev.tips || []).filter((t) => t.id !== id)
        }));
        showNotification('Trinkgeld-Eintrag gelöscht', 'info');
      };

      const addExpense = ({ amount, category, paymentMethod, note, date, addToKleinanzeigen }) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const expDate = date || getTodayISO();
        const newExp = {
          id: 'exp-' + Date.now(),
          date: expDate,
          category,
          amount: val,
          paymentMethod,
          note: note || ''
        };

        let updatedKleinanzeigen = state.kleinanzeigen || [];
        if (addToKleinanzeigen && (paymentMethod === 'Bar A' || paymentMethod === 'Bar B')) {
          const catLabels = {
            supermarkt: 'Supermarkt/Drogerie',
            auswaerts: 'Auswärts essen',
            eauto: 'E-Auto Laden',
            baby: 'Babybedarf'
          };
          updatedKleinanzeigen = [
            {
              id: 'ka-' + Date.now(),
              date: expDate,
              title: `Barauslage (${catLabels[category] || category})${note ? ': ' + note : ''}`,
              amount: val,
              paidBy: paymentMethod === 'Bar A' ? 'A' : 'B',
              splitPercentA: 50,
              settled: false
            },
            ...updatedKleinanzeigen
          ];
        }

        setState((prev) => ({
          ...prev,
          expenses: [newExp, ...(prev.expenses || [])],
          kleinanzeigen: updatedKleinanzeigen
        }));
        showNotification(`Ausgabe (${formatEUR(val)}) gespeichert!`);
      };

      const deleteExpense = (id) => {
        setState((prev) => ({
          ...prev,
          expenses: (prev.expenses || []).filter((e) => e.id !== id)
        }));
        showNotification('Ausgabe entfernt', 'info');
      };

      const updateSalary15th = (amountStr, confirmed = true) => {
        const val = parseDecimal(amountStr);
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            actualSalary15th: val,
            salaryConfirmed: confirmed
          },
          monthlySalaries: {
            ...(prev.monthlySalaries || {}),
            [selectedMonthKey]: { actual: val, confirmed }
          }
        }));
        showNotification(`Netto-Gehalt für ${formatMonthLabel(selectedMonthKey)} (${formatEUR(val)}) gespeichert!`);
      };

      const addPayIn30 = ({ merchant, item, amount, purchaseDate, dueDate }) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const buyDate = purchaseDate || getTodayISO();
        const payDate = dueDate || addDaysISO(buyDate, 30);
        const newEntry = {
          id: 'p30-' + Date.now(),
          merchant: merchant || 'Klarna / PayPal 30T',
          item: item || 'Später-Bezahlen-Kauf',
          amount: val,
          purchaseDate: buyDate,
          dueDate: payDate,
          includeInCurrentMonthPflicht: true,
          settled: false
        };
        setState((prev) => ({
          ...prev,
          payIn30: [newEntry, ...(prev.payIn30 || [])]
        }));
        showNotification(`${formatEUR(val)} als Pay-in-30 gesperrt!`);
      };

      const markPayIn30Settled = (id) => {
        setState((prev) => ({
          ...prev,
          payIn30: (prev.payIn30 || []).map((item) =>
            item.id === id ? { ...item, settled: !item.settled } : item
          )
        }));
        showNotification('Status der Verbindlichkeit aktualisiert!');
      };

      const deletePayIn30 = (id) => {
        setState((prev) => ({
          ...prev,
          payIn30: (prev.payIn30 || []).filter((item) => item.id !== id)
        }));
        showNotification('Pay-in-30 Eintrag gelöscht', 'info');
      };

      const addKleinanzeigenItem = ({ title, amount, paidBy, splitPercentA }) => {
        const val = parseDecimal(amount);
        if (val <= 0) return;
        const newEntry = {
          id: 'ka-' + Date.now(),
          date: getTodayISO(),
          title: title || 'Kleinanzeigen / Barkauf',
          amount: val,
          paidBy: paidBy || 'A',
          splitPercentA: Number(splitPercentA ?? 50),
          settled: false
        };
        setState((prev) => ({
          ...prev,
          kleinanzeigen: [newEntry, ...(prev.kleinanzeigen || [])]
        }));
        showNotification('Barkauf im Verrechner gespeichert!');
      };

      const settleAllKleinanzeigen = () => {
        setState((prev) => ({
          ...prev,
          kleinanzeigen: (prev.kleinanzeigen || []).map((k) => ({ ...k, settled: true }))
        }));
        showNotification('Alle offenen Barauslagen als ausgeglichen markiert!');
      };

      const deleteKleinanzeigen = (id) => {
        setState((prev) => ({
          ...prev,
          kleinanzeigen: (prev.kleinanzeigen || []).filter((k) => k.id !== id)
        }));
      };

      const resetNewMonth = () => {
        setState((prev) => ({
          ...prev,
          tips: (prev.tips || []).filter((t) => !t.date || !t.date.startsWith(selectedMonthKey)),
          expenses: (prev.expenses || []).filter((e) => !e.date || !e.date.startsWith(selectedMonthKey)),
          monthlySalaries: {
            ...(prev.monthlySalaries || {}),
            [selectedMonthKey]: { actual: prev.config.expectedSalary15th, confirmed: false }
          }
        }));
        showNotification(`Buchungen für ${formatMonthLabel(selectedMonthKey)} zurückgesetzt!`);
      };

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-slate-100 dark:bg-slate-950 border-x border-slate-200/70 dark:border-slate-800/80 shadow-2xl relative">
          {/* Header mit Monatsnavigation */}
          <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/90 dark:bg-slate-900/90 border-b border-slate-200/80 dark:border-slate-800/80 px-4 pt-3 pb-2.5 space-y-2">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-900 to-blue-900 flex items-center justify-center text-white shadow-md shadow-blue-900/30">
                  <Icon name="wallet" size={17} />
                </div>
                <div>
                  <h1 className="font-bold text-sm tracking-tight text-slate-900 dark:text-white leading-tight">
                    FlowPilot <span className="text-blue-600 dark:text-blue-400">Partner A</span>
                  </h1>
                  <span className="text-[10px] text-slate-500 dark:text-slate-400 font-medium">
                    Haushalt + Baby (8 Mon.)
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                {deferredInstallPrompt && (
                  <button
                    onClick={handleTriggerInstall}
                    className="px-2.5 py-1.5 rounded-xl bg-blue-900/20 hover:bg-blue-900/30 text-blue-800 dark:text-blue-300 border border-blue-800/30 text-xs font-bold flex items-center gap-1 active:scale-95 transition animate-pulse"
                    title="Auf Google Pixel installieren"
                  >
                    <Icon name="smartphone" size={13} />
                    <span>Installieren</span>
                  </button>
                )}

                <button
                  onClick={() => setModalType('tip')}
                  className="px-2.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border border-emerald-500/25 text-xs font-semibold flex items-center gap-1 active:scale-95 transition"
                  title="Schicht-Trinkgeld eintragen"
                >
                  <Icon name="plus" size={14} />
                  <span>Trinkgeld</span>
                </button>
                <button
                  onClick={toggleTheme}
                  className="p-2 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300/70 dark:hover:bg-slate-700 active:scale-95 transition"
                  aria-label="Theme wechseln"
                >
                  <Icon name={state.theme === 'dark' ? 'sun' : 'moon'} size={16} />
                </button>
              </div>
            </div>

            {/* Monatsnavigation */}
            <div className="flex items-center justify-between pt-1 border-t border-slate-200/60 dark:border-slate-800/60">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setSelectedMonthKey(shiftMonthKey(selectedMonthKey, -1))}
                  className="p-1.5 rounded-xl bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300/70 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 active:scale-95 transition"
                  title="Vorheriger Monat"
                >
                  <Icon name="chevron-left" size={16} />
                </button>

    function BudgetBar({ icon, title, spent, total, color, subInfo, extraBadge }) {
      const pct = total > 0 ? Math.min(100, Math.round((spent / total) * 100)) : 0;
      const remaining = total - spent;
      const isOver = remaining < 0;

      const colorMap = {
        indigo: 'bg-indigo-500',
        amber: 'bg-amber-500',
        blue: 'bg-blue-500',
        emerald: 'bg-emerald-500'
      };

      return (
        <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-800/80">
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-2">
              <Icon name={icon} size={16} className="text-slate-500 dark:text-slate-400" />
              <span className="text-xs font-bold text-slate-800 dark:text-slate-200">{title}</span>
            </div>
            {extraBadge && (
              <span className="text-[9px] font-semibold px-2 py-0.5 rounded-full bg-slate-200/80 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                {extraBadge}
              </span>
            )}
          </div>

          <div className="flex items-baseline justify-between text-xs font-mono mb-1.5">
            <span className="font-bold text-slate-900 dark:text-white">
              {formatEUR(spent)} <span className="text-[10px] text-slate-400 font-normal">von {formatEUR(total)}</span>
            </span>
            <span className={`font-bold ${isOver ? 'text-rose-500' : 'text-slate-500 dark:text-slate-400'}`}>
              {isOver ? `Überzug ${formatEUR(Math.abs(remaining))}` : `Rest ${formatEUR(remaining)}`}
            </span>
          </div>

          <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
            <div
              className={`h-full ${isOver ? 'bg-rose-500' : (colorMap[color] || 'bg-indigo-500')} rounded-full transition-all duration-300`}
              style={{ width: `${pct}%` }}
            />
          </div>

          {subInfo}
        </div>
      );
    }

    // ============================================================================
    // 9. SCREEN 4: EINSTELLUNGEN & DATEN-SICHERHEIT + PWA ZENTRALE
    // ============================================================================
    function SettingsScreen({
      state,
      setState,
      finance,
      selectedMonthKey,
      isInstalledPwa,
      deferredInstallPrompt,
      onTriggerInstall,
      onResetNewMonth,
      showNotification
    }) {
      const fileInputRef = useRef(null);
      const [newAboName, setNewAboName] = useState('');
      const [newAboAmount, setNewAboAmount] = useState('');
      const [confirmMonthReset, setConfirmMonthReset] = useState(false);
      const [showPwaViewer, setShowPwaViewer] = useState(null);

      const c = state.config;

      const updateConfigField = (key, rawValue) => {
        const val = parseDecimal(rawValue);
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            [key]: val
          }
        }));
      };

      const addPrivateAbo = (e) => {
        e.preventDefault();
        const val = parseDecimal(newAboAmount);
        if (!newAboName || val <= 0) return;
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateAbos: [
              ...(prev.config.privateAbos || []),
              { id: 'abo-' + Date.now(), name: newAboName, amount: val }
            ]
          }
        }));
        setNewAboName('');
        setNewAboAmount('');
        showNotification('Privates Abonnement hinzugefügt!');
      };

      const removePrivateAbo = (id) => {
        setState((prev) => ({
          ...prev,
          config: {
            ...prev.config,
            privateAbos: (prev.config.privateAbos || []).filter((a) => a.id !== id)
          }
        }));
      };

      const handleExportJSON = () => {
        try {
          const dataStr = JSON.stringify(state, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `flowpilot-backup-${getTodayISO()}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showNotification('JSON-Backup erfolgreich heruntergeladen!');
        } catch (err) {
          showNotification('Fehler beim Backup-Export', 'error');
        }
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported && imported.config) {
              setState(imported);
              showNotification('Backup erfolgreich wiederhergestellt!');
            } else {
              showNotification('Ungültige Backup-Datei!', 'error');
            }
          } catch (err) {
            showNotification('JSON konnte nicht gelesen werden!', 'error');
          }
        };
        reader.readAsText(file);
      };

      const downloadTextFile = (filename, content, mimeType) => {
        try {
          const blob = new Blob([content], { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showNotification(`${filename} erfolgreich heruntergeladen!`);
        } catch (err) {
          showNotification(`Fehler beim Speichern von ${filename}`, 'error');
        }
      };

      const copyToClipboard = (text, label) => {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-999999px';
          textArea.style.top = '-999999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          showNotification(`${label} in die Zwischenablage kopiert!`);
        } catch (err) {
          showNotification('Kopieren fehlgeschlagen', 'error');
        }
      };

      return (
        <div className="space-y-4">
          {/* PWA & OFFLINE ZENTRALE */}
          <section className="rounded-3xl p-4 bg-gradient-to-br from-blue-950 via-slate-900 to-slate-900 border border-blue-800/40 text-white shadow-lg space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-blue-800/40 text-blue-300 flex items-center justify-center shrink-0">
                  <Icon name="smartphone" size={19} />
                </div>
                <div>
                  <h2 className="text-xs font-bold uppercase tracking-wider text-white">
                    PWA & Offline (Google Pixel)
                  </h2>
                  <p className="text-[11px] text-blue-200/80">
                    Theme: <span className="font-mono text-white">#1e3a8a</span> • Standalone • Portrait
                  </p>
                </div>
              </div>

              <span
                className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                  isInstalledPwa
                    ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                    : 'bg-blue-800/30 text-blue-200 border border-blue-700/30'
                }`}
              >
                {isInstalledPwa ? '✓ Installiert' : 'PWA Ready'}
              </span>
            </div>

            {deferredInstallPrompt && (
              <button
                onClick={onTriggerInstall}
                className="w-full py-2.5 px-3 rounded-2xl bg-gradient-to-r from-blue-900 to-indigo-800 hover:from-blue-800 hover:to-indigo-700 active:scale-95 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-md transition"
              >
                <Icon name="download" size={16} />
                <span>Auf Google Pixel / Android Homescreen installieren</span>
              </button>
            )}

            <div className="p-3 rounded-2xl bg-black/30 border border-white/10 space-y-2 text-xs">
              <div className="flex items-center justify-between">
                <span className="font-semibold text-slate-200">1. Service Worker (sw.js):</span>
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setShowPwaViewer(showPwaViewer === 'sw' ? null : 'sw')}
                    className="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] text-slate-300"
                  >
                    {showPwaViewer === 'sw' ? 'Schließen' : 'Code anzeigen'}
                  </button>
                  <button
                    onClick={() => downloadTextFile('sw.js', PWA_SERVICE_WORKER_CONTENT, 'application/javascript')}
                    className="px-2.5 py-1 rounded-lg bg-blue-800 hover:bg-blue-700 text-[11px] font-bold text-white flex items-center gap-1"
                  >
                    <Icon name="download" size={12} />
                    <span>sw.js</span>
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between border-t border-white/5 pt-2">
                <span className="font-semibold text-slate-200">2. Manifest (manifest.json):</span>
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setShowPwaViewer(showPwaViewer === 'manifest' ? null : 'manifest')}
                    className="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] text-slate-300"
                  >
                    {showPwaViewer === 'manifest' ? 'Schließen' : 'Code anzeigen'}
                  </button>
                  <button
                    onClick={() => downloadTextFile('manifest.json', PWA_MANIFEST_CONTENT, 'application/json')}
                    className="px-2.5 py-1 rounded-lg bg-blue-800 hover:bg-blue-700 text-[11px] font-bold text-white flex items-center gap-1"
                  >
                    <Icon name="download" size={12} />
                    <span>manifest.json</span>
                  </button>
                </div>
              </div>

              {showPwaViewer && (
                <div className="mt-3 pt-2 border-t border-white/10 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-[11px] text-blue-300">
                      {showPwaViewer === 'sw' ? 'sw.js (Cache-First Offline Worker)' : 'manifest.json (Standalone Android Manifest)'}
                    </span>
                    <button
                      onClick={() =>
                        copyToClipboard(
                          showPwaViewer === 'sw' ? PWA_SERVICE_WORKER_CONTENT : PWA_MANIFEST_CONTENT,
                          showPwaViewer === 'sw' ? 'sw.js' : 'manifest.json'
                        )
                      }
                      className="px-2 py-0.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold flex items-center gap-1"
                    >
                      <Icon name="copy" size={11} />
                      <span>Kopieren</span>
                    </button>
                  </div>
                  <pre className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 font-mono text-[10px] text-slate-300 max-h-48 overflow-y-auto leading-relaxed whitespace-pre-wrap select-all">
                    {showPwaViewer === 'sw' ? PWA_SERVICE_WORKER_CONTENT : PWA_MANIFEST_CONTENT}
                  </pre>
                </div>
              )}
            </div>
          </section>

          {/* DATEN-SICHERHEIT & BACKUP */}
          <section className="rounded-3xl p-4 bg-gradient-to-br from-slate-900 to-indigo-950 border border-indigo-500/30 text-white shadow-lg space-y-3">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-2xl bg-emerald-500/20 text-emerald-300 flex items-center justify-center shrink-0">
                <Icon name="shield" size={19} />
              </div>
              <div>
                <h2 className="text-xs font-bold uppercase tracking-wider text-white">
                  100% Lokaler Speicher & Datenschutz
                </h2>
                <p className="text-[11px] text-slate-300">
                  Alle Daten liegen im <code className="text-indigo-300">localStorage</code> deines Handys.
                </p>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2.5 pt-1">
              <button
                onClick={handleExportJSON}
                className="py-2.5 px-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md transition"
              >
                <Icon name="download" size={15} />
                <span>JSON-Backup Export</span>
              </button>

              <button
                onClick={() => fileInputRef.current?.click()}
                className="py-2.5 px-3 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-95 text-white font-bold text-xs border border-white/15 flex items-center justify-center gap-1.5 transition"
              >
                <Icon name="upload" size={15} />
                <span>JSON-Import</span>
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".json,application/json"
                onChange={handleImportJSON}
                className="hidden"
              />
            </div>

            <div className="pt-2 border-t border-white/10 flex items-center justify-between">
              <span className="text-[11px] text-slate-300">
                Buchungen für {formatMonthLabel(selectedMonthKey)} leeren:
              </span>
              {!confirmMonthReset ? (
                <button
                  onClick={() => setConfirmMonthReset(true)}
                  className="px-3 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[11px] font-bold flex items-center gap-1"
                >
                  <Icon name="refresh" size={12} />
                  <span>Monats-Reset</span>
                </button>
              ) : (
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => {
                      onResetNewMonth();
                      setConfirmMonthReset(false);
                    }}
                    className="px-2.5 py-1 rounded-lg bg-rose-600 text-white text-[11px] font-bold"
                  >
                    Jetzt leeren
                  </button>
                  <button
                    onClick={() => setConfirmMonthReset(false)}
                    className="px-2 py-1 rounded-lg bg-white/10 text-slate-300 text-[11px]"
                  >
                    Abbruch
                  </button>
                </div>
              )}
            </div>
          </section>

          {/* GEMEINSCHAFTSKONTO */}
          <section className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3">
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                1. Gemeinschaftskonto (ING) & Entlastungen
              </h3>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Nach Abzug von Wohngeld & Kindergeld wird 50:50 geteilt ({formatEUR(finance.partnerAJointShare)} je Partner)
              </p>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <SettingNumberField
                label="Warmmiete (Gesamt)"
                value={c.warmmiete}
                onChange={(v) => updateConfigField('warmmiete', v)}
              />
              <SettingNumberField
                label="Wohngeld (Entlastung)"
                value={c.wohngeld}
                onChange={(v) => updateConfigField('wohngeld', v)}
                highlight="emerald"
              />
              <SettingNumberField
                label="Strom, Gas & Internet"
                value={c.stromHeizungInternet}
                onChange={(v) => updateConfigField('stromHeizungInternet', v)}
              />
              <SettingNumberField
                label="Kindergeld (Baby 1:1)"
                value={c.kindergeld}
                onChange={(v) => updateConfigField('kindergeld', v)}
                highlight="emerald"
              />
              <SettingNumberField
                label="Sonstige Gem.-Fixkosten"
                value={c.sonstigeGemeinschaftFix}
                onChange={(v) => updateConfigField('sonstigeGemeinschaftFix', v)}
              />
              <div className="flex flex-col justify-end">
                <label className="flex items-center gap-2 p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 cursor-pointer text-xs">
                  <input
                    type="checkbox"
                    checked={c.includeSinkingInJoint}
                    onChange={(e) =>
                      setState((prev) => ({
                        ...prev,
                        config: { ...prev.config, includeSinkingInJoint: e.target.checked }
                      }))
                    }
                    className="rounded text-indigo-600 focus:ring-indigo-500"
                  />
                  <span className="text-[11px] font-medium leading-tight">
                    Tagesgeld-Rate ({formatEUR(finance.sinkingMonthlyTotal)}) einbeziehen
                  </span>
                </label>
              </div>
            </div>
          </section>

          {/* BUDGETS */}
          <section className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3">
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                2. Monatliche Alltags-Budgets (Gemeinschaft)
              </h3>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Jederzeit frei konfigurierbare Budget-Limits
              </p>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <SettingNumberField
                label="Supermarkt & Drogerie"
                value={c.budgetSupermarkt}
                onChange={(v) => updateConfigField('budgetSupermarkt', v)}
              />
              <SettingNumberField
                label="Auswärts / Bestellen"
                value={c.budgetAuswaerts}
                onChange={(v) => updateConfigField('budgetAuswaerts', v)}
              />
              <SettingNumberField
                label="E-Auto Sammelrechnung"
                value={c.budgetEAuto}
                onChange={(v) => updateConfigField('budgetEAuto', v)}
              />
              <SettingNumberField
                label="Baby-Budget (Kindergeld)"
                value={c.budgetBaby}
                onChange={(v) => updateConfigField('budgetBaby', v)}
              />
            </div>
          </section>

          {/* PRIVATE PFLICHTAUSGABEN */}
          <section className="bg-white dark:bg-slate-900 rounded-3xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800/90 space-y-3">
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                3. Partner A: Private Pflichtkosten & Basisgehalt
              </h3>
              <p className="text-[11px] text-slate-500 dark:text-slate-400">
                Bestimmt zusammen mit dem 50% Anteil deinen dynamischen Schwellenwert
              </p>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <SettingNumberField
                label="Erwartetes Gehalt am 15."
                value={c.expectedSalary15th}
                onChange={(v) => updateConfigField('expectedSalary15th', v)}
                highlight="indigo"
              />
              <SettingNumberField
                label="Auto-Rate an Partnerin"
                value={c.rateAutoPartnerin}
                onChange={(v) => updateConfigField('rateAutoPartnerin', v)}
              />
              <SettingNumberField
                label="KfW-Kredit (Monatsrate)"
                value={c.rateKfw}
                onChange={(v) => updateConfigField('rateKfw', v)}
              />
              <SettingNumberField
                label="Rate Kühlschrank"
                value={c.rateKuehlschrank}
                onChange={(v) => updateConfigField('rateKuehlschrank', v)}
              />
            </div>

            {/* Abos */}
            <div className="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-700 dark:text-slate-300">
                  Private Abonnements (z.B. YouTube Premium)
                </span>
                <span className="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400">
                  Σ {formatEUR(finance.privateAbosTotal)}
                </span>
              </div>

              <div className="space-y-1.5">
                {(c.privateAbos || []).map((abo) => (
                  <div
                    key={abo.id}
                    className="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 text-xs"
                  >
                    <span className="font-medium text-slate-800 dark:text-slate-200">{abo.name}</span>
                    <div className="flex items-center gap-2">
                      <span className="font-mono font-bold">{formatEUR(abo.amount)}</span>
                      <button
                        onClick={() => removePrivateAbo(abo.id)}
                        className="p-1 text-slate-400 hover:text-rose-500"
                      >
                        <Icon name="trash" size={14} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <form onSubmit={addPrivateAbo} className="grid grid-cols-12 gap-2 pt-1">
                <input
                  type="text"
                  placeholder="Neues Abo (z.B. Spotify)"
                  value={newAboName}
                  onChange={(e) => setNewAboName(e.target.value)}
                  className="col-span-6 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300/80 dark:border-slate-700 text-xs"
                />
                <input
                  type="text"
                  inputMode="decimal"
                  placeholder="Betrag €"
                  value={newAboAmount}
                  onChange={(e) => setNewAboAmount(e.target.value)}
                  className="col-span-4 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300/80 dark:border-slate-700 font-mono text-xs"
                />
                <button
                  type="submit"
                  className="col-span-2 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold flex items-center justify-center"
                >
                  <Icon name="plus" size={15} />
                </button>
              </form>
            </div>
          </section>
        </div>
      );
    }

    function SettingNumberField({ label, value, onChange, highlight }) {
      const [localVal, setLocalVal] = useState(String(value));

      useEffect(() => {
        setLocalVal(String(value));
      }, [value]);

      const handleBlur = () => {
        onChange(localVal);
      };

      const borderClass =
        highlight === 'emerald'
          ? 'border-emerald-500/40 bg-emerald-500/5'
          : highlight === 'indigo'
          ? 'border-indigo-500/40 bg-indigo-500/5'
          : 'border-slate-300/80 dark:border-slate-700 bg-slate-100 dark:bg-slate-800';

      return (
        <div>
          <label className="text-[10px] font-semibold uppercase text-slate-500 dark:text-slate-400 block mb-1 truncate">
            {label}
          </label>
          <div className="relative">
            <input
              type="text"
              inputMode="decimal"
              value={localVal}
              onChange={(e) => {
                setLocalVal(e.target.value);
                onChange(e.target.value);
              }}
              onBlur={handleBlur}
              className={`w-full px-3 py-2 rounded-2xl border font-mono text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 ${borderClass}`}
            />
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] text-slate-400 font-mono">
              €
            </span>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 10. QUICK MODAL (Tagesaktuelles Standard-Datum)
    // ============================================================================
    function QuickModal({ modalType, onClose, state, finance, selectedMonthKey, onAddTip, onAddExpense, onUpdateSalary }) {
      const [amount, setAmount] = useState(
        modalType === 'salary' ? String(finance.effectiveSalary15) : ''
      );
      const [date, setDate] = useState(() => getTodayISO());
      const [note, setNote] = useState('');
      const [category, setCategory] = useState('supermarkt');
      const [paymentMethod, setPaymentMethod] = useState('Gemeinschaftskarte');
      const [addToKleinanzeigen, setAddToKleinanzeigen] = useState(true);

      const handleSubmit = (e) => {
        e.preventDefault();
        const actionDate = date || getTodayISO();
        if (modalType === 'tip') {
          onAddTip(amount, actionDate, note || 'Schicht-Trinkgeld');
        } else if (modalType === 'expense') {
          onAddExpense({
            amount,
            category,
            paymentMethod,
            note,
            date: actionDate,
            addToKleinanzeigen: paymentMethod !== 'Gemeinschaftskarte' && addToKleinanzeigen
          });
        } else if (modalType === 'salary') {
          onUpdateSalary(amount, true);
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl p-5 border-t border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                {modalType === 'tip' && '💰 Schicht-Trinkgeld erfassen'}
                {modalType === 'expense' && '🛒 Gemeinschaftsausgabe erfassen'}
                {modalType === 'salary' && `🏦 Netto-Gehalt am 15. (${formatMonthLabel(selectedMonthKey)})`}
              </h3>
              <button
                onClick={onClose}
                className="p-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500"
              >
                <Icon name="x" size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5">
              <div>
                <label className="text-[11px] font-bold uppercase text-slate-400 block mb-1">
                  Betrag in Euro
                </label>
                <input
                  type="text"
                  inputMode="decimal"
                  autoFocus
                  placeholder="0,00"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  required
                  className="w-full px-4 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-mono text-2xl font-extrabold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              {modalType === 'expense' && (
                <>
                  <div>
                    <label className="text-[11px] font-bold uppercase text-slate-400 block mb-1.5">
                      Budget-Kategorie (Gemeinschaft)
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { id: 'supermarkt', label: '🛒 Supermarkt & Drogerie' },
                        { id: 'auswaerts', label: '🍕 Auswärts / Bestellen' },
                        { id: 'eauto', label: '⚡ E-Auto Sammelrechnung' },
                        { id: 'baby', label: '👶 Babybedarf (Kindergeld)' }
                      ].map((cat) => (
                        <button
                          key={cat.id}
                          type="button"
                          onClick={() => setCategory(cat.id)}
                          className={`p-2.5 rounded-2xl text-xs font-bold text-left border transition ${
                            category === cat.id
                              ? 'bg-indigo-600 text-white border-indigo-500 shadow'
                              : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                          }`}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold uppercase text-slate-400 block mb-1.5">
                      Zahlungsweg
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {['Gemeinschaftskarte', 'Bar A', 'Bar B'].map((pm) => (
                        <button
                          key={pm}
                          type="button"
                          onClick={() => setPaymentMethod(pm)}
                          className={`py-2 px-2 rounded-xl text-xs font-bold border transition ${
                            paymentMethod === pm
                              ? 'bg-emerald-600 text-white border-emerald-500'
                              : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                          }`}
                        >
                          {pm}
                        </button>
                      ))}
                    </div>
                  </div>

                  {paymentMethod !== 'Gemeinschaftskarte' && (
                    <label className="flex items-center gap-2 p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-700 dark:text-amber-300">
                      <input
                        type="checkbox"
                        checked={addToKleinanzeigen}
                        onChange={(e) => setAddToKleinanzeigen(e.target.checked)}
                        className="rounded text-amber-600"
                      />
                      <span>Automatisch im 50:50 Barauslagen-Verrechner vormerken</span>
                    </label>
                  )}
                </>
              )}

              {modalType !== 'salary' && (
                <div className="grid grid-cols-12 gap-2">
                  <div className="col-span-7">
                    <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                      Notiz (Optional)
                    </label>
                    <input
                      type="text"
                      placeholder={modalType === 'tip' ? 'z.B. Spätschicht' : 'z.B. DM Einkauf'}
                      value={note}
                      onChange={(e) => setNote(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs"
                    />
                  </div>
                  <div className="col-span-5">
                    <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">
                      Datum
                    </label>
                    <input
                      type="date"
                      value={date}
                      onChange={(e) => setDate(e.target.value)}
                      className="w-full px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs"
                    />
                  </div>
                </div>
              )}

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition"
              >
                Jetzt verbindlich speichern
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 11. NAVIGATION BUTTON HELPER
    // ============================================================================
    function NavButton({ active, onClick, icon, label, badge, badgeColor }) {
      return (
        <button
          onClick={onClick}
          className={`relative flex flex-col items-center justify-center py-2 rounded-2xl transition-all active:scale-95 ${
            active
              ? 'text-indigo-600 dark:text-indigo-400 bg-indigo-500/10 font-semibold'
              : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 font-medium'
          }`}
        >
          <div className="relative">
            <Icon name={icon} size={20} />
            {badge && (
              <span
                className={`absolute -top-1.5 -right-5 px-1.5 py-0.2 rounded-full text-[9px] font-bold leading-tight ${badgeColor}`}
              >
                {badge}
              </span>
            )}
          </div>
          <span className="text-[11px] mt-1 tracking-tight">{label}</span>
        </button>
      );
    }

    // React App Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
